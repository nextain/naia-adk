# deploy-spec.yaml — 최소 예제 (24h naia-corp 배포파이프라인 환산)

version: 1

envs:
  dev:
    target: naia-corp-dev
    branch: dev
    method: git-archive
    verify:
      url: https://www.naia-corp-pick.org
      expect_status: [200, 301, 302]
    snapshot:
      kind: tar
      required: false
    rollback:
      method: snapshot-restore
      playbook_ref: docs/runbook/dev-rollback.md
    risk_tier: R1
    human_required: false

  staging:
    target: naia-corp-dev
    branch: main
    method: git-pull
    verify:
      url: https://www.naia-corp.net
      expect_status: [200]
    snapshot:
      kind: tar
      required: true
    rollback:
      method: snapshot-restore
      playbook_ref: docs/runbook/staging-rollback.md
    risk_tier: R3
    human_required: true

  prod:
    target: naia-corp-web
    branch: main
    method: git-pull
    verify:
      url: https://www.naia-corp.com
      expect_status: [200]
    snapshot:
      kind: gcp-disk
      required: true
    rollback:
      method: snapshot-restore
      playbook_ref: docs/runbook/prod-rollback.md
    risk_tier: R4
    human_required: true
