# cost-budget.yaml — 최소 예제 (단일 사용자 monthly budget 환산)

version: 1
id: budget-personal-2026-05
currency: USD

limits:
  soft: 80
  hard: 120

period:
  kind: monthly

providers:
  anthropic:
    input_rate: 0.015
    output_rate: 0.075
    session_share_cap: 0.6
  openai:
    input_rate: 0.010
    output_rate: 0.030
    session_share_cap: 0.4
  google:
    input_rate: 0.0125
    output_rate: 0.0375
    session_share_cap: 0.5

alerts:
  - at_percent: 50
    channels: [log, ui-toast]
  - at_percent: 80
    channels: [log, ui-toast, audit]
  - at_percent: 95
    channels: [log, ui-modal, audit]
