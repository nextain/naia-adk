# 공통 채널·담당 표 예시 (channels.example.yaml)
# 번호(Discord ID)나 기기·계정·모델 이름을 넣지 않고 역할 이름과 규칙만 적는다.
schemaVersion: 1
company: nextain
roles: [coordinator, ops, reviewer, assistant]
servers:
  - key: internal
    channels:
      - key: studio
        name: 나이아-스튜디오
        wakeRoles: [coordinator, ops, reviewer, assistant]
        primaryRole: coordinator
        outsideCall: mention-or-name
        description: 스튜디오 개발. 주 담당 coordinator. 부르지 않은 글은 다른 역할이 읽기만 합니다.
      - key: shell
        name: 나이아-쉘
        wakeRoles: [coordinator, ops, reviewer, assistant]
        primaryRole: coordinator
        outsideCall: mention-or-name
        description: 데스크톱 앱 개발. 주 담당 coordinator.
      - key: adk
        name: 나이아-adk
        wakeRoles: [coordinator, ops, reviewer, assistant]
        primaryRole: coordinator
        outsideCall: mention-or-name
        description: ADK 작업 방식과 도구. 주 담당 coordinator.
      - key: infra
        name: 나이아-인프라
        wakeRoles: [ops]
        primaryRole: ops
        outsideCall: mention
        description: 서버·기기·배포. 주 담당 ops. 부를 때는 봇을 언급해 주세요.
      - key: persona
        name: 나이아-페르소나
        wakeRoles: [reviewer, coordinator]
        primaryRole: reviewer
        outsideCall: mention
        description: 페르소나와 학습 자료. 주 담당 reviewer, coordinator 협업. 부를 때는 봇을 언급해 주세요.
      - key: ax-edu
        name: ax교육
        wakeRoles: [coordinator, ops, reviewer, assistant]
        primaryRole: assistant
        outsideCall: mention-or-name
        description: 교육과 AX 영업. 주 담당 assistant.
  - key: customer
    channels: []
