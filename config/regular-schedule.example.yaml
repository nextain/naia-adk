# Copy to an instance-private regular-schedule.yaml. No timer is enabled by this file.
version: 1
timezone: UTC
schedules:
  - id: session-audit
    role: "<role>"
    task: "Audit session activity"
    cadence: daily
    time: "00:00"
    graceMinutes: 15
    status: 제안
    mechanism:
      kind: timer
      target: "<reviewed-local-command-mapping>"
      timer: null
    approval: null
    last_result:
      at: null
      outcome: not-run
      evidence: null
  - id: daily-reflection
    role: "<role>"
    task: "Write a daily reflection"
    cadence: daily
    time: "22:00"
    graceMinutes: 15
    status: 제안
    mechanism:
      kind: wake
      target: "<binding-id>"
      timer: null
    approval: null
    last_result:
      at: null
      outcome: not-run
      evidence: null
  - id: weekly-reading
    role: "<role>"
    task: "Review the reading list"
    cadence: "weekly:MON"
    time: "18:30"
    graceMinutes: 15
    status: 사람
    mechanism:
      kind: manual
      target: "<owner>"
      timer: null
    approval: null
    last_result:
      at: null
      outcome: not-run
      evidence: null
  - id: weekly-security-review
    role: "<security-role>"
    task: "Review security findings and remediation status"
    cadence: "weekly:MON"
    time: "09:00"
    graceMinutes: 15
    status: 제안
    mechanism:
      kind: timer
      target: "<reviewed-local-command-mapping>"
      timer: null
    approval: null
    last_result:
      at: null
      outcome: not-run
      evidence: null
  - id: daily-security-advisory
    role: "<security-role>"
    task: "Receive security advisories and match local assets"
    cadence: "daily"
    time: "09:15"
    graceMinutes: 15
    status: 제안
    mechanism:
      kind: timer
      target: "<reviewed-local-command-mapping>"
      timer: null
    approval: null
    last_result:
      at: null
      outcome: not-run
      evidence: null
