name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Native harness, session isolation, and request-contract gates
        run: pnpm test:harness-native
      - name: Naia account document translation adapter
        run: python .agents/skills/translate-doc/tests/test_naia_translate.py
