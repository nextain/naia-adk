name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build

  test:
    # Keep the namespace/AppArmor runtime on the validated LTS image.
    # ubuntu-latest moved to 26.04 and broke isolated reviewer launches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Install fixed registered Node runtime
        run: |
          registered_node_source="$(node -p 'process.execPath')"
          node -e 'const fs=require("node:fs");const [major,minor]=process.versions.node.split(".").map(Number);if(major!==22||minor<15)throw Error("Registered gates require Node22.15+");const fd=fs.openSync(process.execPath,"r");try{const b=Buffer.alloc(4);fs.readSync(fd,b,0,4,0);if(!b.equals(Buffer.from([127,69,76,70])))throw Error("Native ELF Node required")}finally{fs.closeSync(fd)}'
          registered_node_sha="$(sha256sum "$registered_node_source" | cut -d ' ' -f 1)"
          registered_node_version="$("$registered_node_source" --version)"
          if [ "$registered_node_source" != /usr/bin/node ]; then
            sudo install -o root -g root -m 0755 -- "$registered_node_source" /usr/bin/node
          fi
          test ! -L /usr/bin/node
          test "$(stat -c '%u:%g:%a' /usr/bin/node)" = '0:0:755'
          test "$(sha256sum /usr/bin/node | cut -d ' ' -f 1)" = "$registered_node_sha"
          test "$(/usr/bin/node --version)" = "$registered_node_version"
          printf 'Registered Node: %s sha256=%s source=%s\n' "$registered_node_version" "$registered_node_sha" "$registered_node_source"
      - run: pnpm test
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap
          sudo tee /etc/apparmor.d/naia-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/naia-bwrap
          /usr/bin/bwrap --version
          node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const runner = require('./.agents/hooks/core/request-contract-review-runner.js');
          // Only synthetic bytes enter this probe, so its raw diagnostics are safe.
          const reviewer = runner.anonymousSnapshot(Buffer.from('#!/usr/bin/sh\nset -eu\ntest -r /proc/self/stat\ntest -w /dev/null\ntest -r "$REQUEST_CONTRACT_BUNDLE"\nprintf \'{"probe":true}\\n\'\n'), 0o500);
          let bundle;
          try {
            bundle = runner.anonymousSnapshot(Buffer.from('{}'), 0o400);
            const { args } = runner.bubblewrapProfile();
            console.log(JSON.stringify({ sandbox: '/usr/bin/bwrap', args }));
            const result = cp.spawnSync('/usr/bin/bwrap', args, {
              env: { PATH: '/usr/bin:/bin' }, encoding: 'utf8', timeout: 30000,
              stdio: ['ignore', 'pipe', 'pipe', 'pipe', reviewer, bundle, 'pipe'],
            });
            console.log(JSON.stringify({ status: result.status, signal: result.signal, stderr: result.stderr, stdout: result.stdout, error: result.error?.code }));
            if (result.error || result.status !== 0 || result.stdout?.trim() !== '{"probe":true}') process.exitCode = 1;
          } finally {
            fs.closeSync(reviewer);
            if (bundle !== undefined) fs.closeSync(bundle);
          }
          NODE
      - name: Native harness, session isolation, and request-contract gates
        run: pnpm test:harness-native
      - name: Approval plan deploy gate and registered executor
        run: pnpm test:registered-gate
      - name: Naia account document translation adapter
        run: python .agents/skills/translate-doc/tests/test_naia_translate.py
      - name: Natural writing skill linter tests
        run: node --test .agents/skills/natural-writing/tests/lint-writing.test.mjs
      - name: Doc and test sync check (PR diff advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Advisory warning: 7/29 open main PRs (incl. #184, #78) fail current heuristics;
          # scope to PR diff against PR base so existing open PRs and pre-existing debt are not broken.
          if [ -f .git/shallow ] && [ -n "${GITHUB_REF:-}" ]; then
            git fetch --no-tags --deepen=1 origin "$GITHUB_REF" >/dev/null 2>&1 || true
          fi
          if [ "$(git rev-parse -q --verify HEAD^2 2>/dev/null)" = "$HEAD_SHA" ] && git rev-parse -q --verify HEAD^1 >/dev/null 2>&1; then
            RANGE="HEAD^1..HEAD"
          else
            if [ -f .git/shallow ]; then
              git fetch --no-tags --unshallow origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head" || true
            else
              git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head" >/dev/null 2>&1 || true
            fi
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || git merge-base "origin/${BASE_REF}" HEAD)"
            RANGE="${MERGE_BASE}..HEAD"
          fi
          if ! node scripts/check-guide-freshness.mjs --sync-check --range "$RANGE"; then
            echo "::warning::Doc/test sync check reported code/doc/test gaps or broken links in PR diff (advisory; see docs/guides/development-method.md)."
            exit 1
          fi
