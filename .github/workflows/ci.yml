name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build

  test:
    # Keep the namespace/AppArmor runtime on the validated LTS image.
    # ubuntu-latest moved to 26.04 and broke isolated reviewer launches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap
          sudo tee /etc/apparmor.d/naia-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/naia-bwrap
          /usr/bin/bwrap --version
          node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const runner = require('./.agents/hooks/core/request-contract-review-runner.js');
          // Only synthetic bytes enter this probe, so its raw diagnostics are safe.
          const reviewer = runner.anonymousSnapshot(Buffer.from('#!/usr/bin/sh\nset -eu\ntest -r /proc/self/stat\ntest -w /dev/null\ntest -r "$REQUEST_CONTRACT_BUNDLE"\nprintf \'{"probe":true}\\n\'\n'), 0o500);
          let bundle;
          try {
            bundle = runner.anonymousSnapshot(Buffer.from('{}'), 0o400);
            const { args } = runner.bubblewrapProfile();
            console.log(JSON.stringify({ sandbox: '/usr/bin/bwrap', args }));
            const result = cp.spawnSync('/usr/bin/bwrap', args, {
              env: { PATH: '/usr/bin:/bin' }, encoding: 'utf8', timeout: 30000,
              stdio: ['ignore', 'pipe', 'pipe', 'pipe', reviewer, bundle, 'pipe'],
            });
            console.log(JSON.stringify({ status: result.status, signal: result.signal, stderr: result.stderr, stdout: result.stdout, error: result.error?.code }));
            if (result.error || result.status !== 0 || result.stdout?.trim() !== '{"probe":true}') process.exitCode = 1;
          } finally {
            fs.closeSync(reviewer);
            if (bundle !== undefined) fs.closeSync(bundle);
          }
          NODE
      - name: Native harness, session isolation, and request-contract gates
        run: pnpm test:harness-native
      - name: Approval plan deploy gate
        run: node .claude/hooks/test/run-approval-plan-gate-test.cjs
      - name: Naia account document translation adapter
        run: python .agents/skills/translate-doc/tests/test_naia_translate.py
      - name: Natural writing skill linter tests
        run: node --test .agents/skills/natural-writing/tests/lint-writing.test.mjs
