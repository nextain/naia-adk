#
# Core philosophy of the Naia ADK project.
# This is the "why" — separated from "what" (architecture) and "how" (workflows).

version: 1

principles:
  ai_sovereignty:
    title: "AI Sovereignty"
    statement: "Users choose their AI — no vendor lock-in"
    details:
      - "Support multiple LLM providers (Vertex AI, Anthropic, xAI, local models)"
      - "Users own their AI configuration and can switch freely"
      - "No single provider dependency in core architecture"

  privacy_first:
    title: "Privacy First"
    statement: "Local execution by default — cloud is opt-in"
    details:
      - "Desktop-first architecture (Tauri, not Electron cloud)"
      - "User data stays on device unless explicitly shared"
      - "Local LLM support (Ollama) as first-class citizen"

  transparency:
    title: "Transparency"
    statement: "Open source — verify by reading the code"
    details:
      - "All core logic is open source (Apache 2.0)"
      - "AI context is open and forkable (CC-BY-SA 4.0)"
      - "No hidden telemetry or data collection"

  assembly_philosophy:
    title: "Assembly over Invention"
    statement: "Compose from proven components — don't reinvent"
    details:
      - "Use upstream projects as building blocks (OpenClaw, Tauri, etc.)"
      - "Contribute back to upstream when possible"
      - "Reference submodules (ref-*) for learning and tracking"

  always_on:
    title: "Always On"
    statement: "AI companion as a daemon — always present, always ready"
    details:
      - "Background agent architecture (Node.js daemon)"
      - "Gateway process management (spawn, restart, health check)"
      - "Persistent AI character state across sessions"

  avatar_centric:
    title: "Avatar-Centric"
    statement: "AI as a living character — not just a tool"
    details:
      - "Naia: named AI character with personality and voice"
      - "3D avatar with TTS and emotional expression"
      - "Soul document (SOUL.md) defines character identity"

  vibe_coding_era:
    title: "Vibe Coding Era"
    statement: "AI context files are the new contribution infrastructure"
    details:
      - ".agents/ directories encode project philosophy, not just config"
      - "Context quality determines AI collaboration quality"
      - "Dual-directory architecture: AI-optimized + human-readable"
      - "CC-BY-SA licensing preserves the contribution chain"

  layered_supervision:
    title: "Layered Supervision"
    statement: "Layers exist to put a supervisor outside the work being supervised"
    details:
      - "A session cannot audit its own drift — self-review is a closed loop"
      - "Each layer is audited by the one above it: L1←L2, L2←L3, L3←human owner"
      - "L2 is an engine that makes one issue get done, not a wall that blocks work"
      - "L2 carries three duties: supervise drift, route work to a cost-appropriate profile, hold the development process"
      - "Layer contract lives in .agents/context/development-model-routing.yaml"

# Where the layered architecture is headed. The contract in
# development-model-routing.yaml says what each layer is; this says which product
# gets built out next. Lower layers are proven before higher ones are stacked.
roadmap:
  layered_rollout:
    current_focus: "prove L2 — the issue engine — before building L3 on top of it"
    build_order:
      - product: "Discord gateway"
        note: "First surface to grow the full three layers. Sits at L3 today but has been operating as a single layer."
      - product: "naia-agent"
        note: "Second surface, after the Discord gateway has the three layers working."
      - product: "naia-shell"
        note: "Third surface."
    rule: |
      This is the order in which products grow the three-layer structure, not a mapping
      of products onto layers. Each product eventually carries L3, L2, and L1 itself.

mirrors:
  korean: ".users/context/philosophy.md"
  english: ".users/context/en/philosophy.md"
