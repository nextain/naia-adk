# 디스코드 게이트웨이와 나이아 페르소나 공유
#
# 이 파일은 "왜 이렇게 만들었나"를 적는다. 운영 절차는
# .agents/skills/manage-discord-sessions/references/operations-detail.md 에 있고,
# 배치 현황은 .agents/context/discord-gateway-deployment.yaml 에 있다.
version: 1
scope: 나이아 대화봇과 업무 게이트웨이가 한 정체성을 쓰는 구조
status: active_contract
updated_at: 2026-09-13

사상:
  한줄: "나이아는 자기 페르소나로 대화하고, 업무는 같은 페르소나를 쓰는 별도 게이트웨이의 코딩 에이전트가 받는다."
  왜: |
    사용자에게는 한 사람이어야 한다. 대화할 때의 나이아와 일을 맡길 때의 나이아가
    다른 말투와 다른 이름으로 나타나면 두 도구를 쓰는 것이 된다.

    그런데 대화와 업무는 실행 환경이 다르다. 대화는 나이아 자신이 답하고, 업무는
    작업공간에 붙은 코딩 에이전트가 저장소를 뒤지고 파일을 고쳐야 한다. 그래서
    실행은 나누되 정체성은 나눈다.

    나이아가 로컬 claude 나 codex CLI 를 불러 쓰는 것과 같은 결이다. 나이아는
    선언하고, 실행은 그 도구가 한다. 디스코드 업무 게이트웨이도 같다 — 나이아가
    채널과 봇을 지정하면 게이트웨이가 생기고, 그 게이트웨이의 코딩 에이전트는
    나이아의 페르소나를 그대로 입는다.
  아닌것: |
    "모든 에이전트가 함께 쓰는 일반 페르소나"가 아니다. 공유되는 것은 나이아의
    페르소나이고, 공유하는 쪽은 나이아의 업무 게이트웨이다. 다른 제품이나 다른
    사람의 에이전트가 이 파일을 정체성으로 삼는 구조가 아니다.

    저장소를 건너뛰는 공유도 아니다. 페르소나는 설정된 작업공간과 그 워크스페이스의
    나이아 설정에서만 읽는다.

역할:
  나이아_대화봇:
    무엇: 나이아 셸의 대화 상대
    페르소나: 나이아 설정(naia-settings)의 것
    일: 대화. 저장소를 고치지 않는다.
  업무_게이트웨이:
    무엇: 디스코드 채널에 붙은 코딩 에이전트
    페르소나: 같은 나이아 설정에서 가져온다 — 별도로 적지 않는다
    일: 작업 요청을 받아 이슈를 세우고 그 이슈로 작업한다

나이아_셸이_하는_일:
  - "사용자가 디스코드 채널과 봇 토큰을 넣는다"
  - "셸이 messenger 인스턴스 설정을 만든다 — 페르소나 글은 적지 않는다"
  - "게이트웨이가 나이아 설정에서 페르소나를 읽어 프롬프트의 정체성 자리에 싣는다"
  - "사용자는 같은 나이아에게 대화도 하고 일도 맡긴다"

경계:
  - "게이트웨이는 나이아 설정에서 정해진 항목만 읽는다. 그 파일에는 자격값도 있으므로 통째로 프롬프트에 싣지 않는다."
  - "인스턴스마다 다른 것(어느 채널, 어느 저장소, 무엇을 안 건드리는지)은 인스턴스 설정의 persona.instructions 에 남는다. 정체성은 공유하고 경계는 나눈다."
  - "나이아 셸이 없는 설치에서도 게이트웨이는 돌아야 한다. 그때는 페르소나를 파일이나 인라인 글로 적는다."
  - "페르소나가 바뀌면 컨텍스트 해시가 바뀌고 서비스 재시작이 필요하다. 도는 작업의 정체성이 중간에 바뀌지 않게 하려는 것이다."
