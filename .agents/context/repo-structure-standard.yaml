# Naia ADK — Repository Structure Standard
# SoT for per-repo documentation, SDLC artifact, and RBAC structure.
#
# Applies to direct personal forks and to the optional organization-family
# lineage. A personal fork may use this standard without an organization fork.
# Fork customization: create FORK.md with an `overrides:` section.
# Human mirrors:
# .users/context/repo-structure-standard.md (Korean)
# .users/context/en/repo-structure-standard.md (English)

version: "1.0"
spec_date: "2026-05-27"

# ─── Language Defaults / Overrides ───────────────────────────────────────────
# Default: public OSS repos are documented English-primary (international reach);
# maintainer/user forks Korean-primary (maintainer language).
# Maintainer override (2026-06-22): the public naia-adk entry docs use Korean-first
# user documentation: README.md is Korean and README.en.md is English. The shared
# agent index is English: AGENTS.md is canonical and CLAUDE.md/GEMINI.md are
# byte-identical mirrors. .users/context/ is Korean and .users/context/en/ is
# the English human mirror.
language_primary_overrides:
  - naia-adk
# naia-memory follows its own repository rules and is not classified by this workspace standard.

# ─── Repo Types ──────────────────────────────────────────────────────────────
# Classify each repo by purpose to determine mirror pattern and required dirs.

repo_types:
  workspace_adk:
    description: "ADK workspace repos — the top-level shell a developer works inside"
    examples: [naia-adk, naia-business-adk, "{org}-adk", "{user}-adk"]
    visibility_default: "public base; forks are typically private"
    required_dirs:
      - .agents/context/     # AI SoT — agents-rules.json + project-index.yaml mandatory
      - .users/context/      # Korean human guide; .users/context/en/ is the English mirror
    optional_dirs:
      - .agents/workflows/
      - .agents/skills/
      - .agents/hooks/
      - .agents/requirements/
      - .agents/progress/    # SDLC artifacts (gitignored)
      - .agents/work/        # temp work (gitignored)
      - skills/              # published skills
      - packages/
      - scripts/
      - templates/
      - docs/

  runtime_library:
    description: "Runtime/library repos — standalone packages used by hosts"
    examples: [naia-agent, naia-memory]
    visibility_default: public
    required_dirs:
      - .agents/context/     # AI SoT
      - docs/                # English SoT — primary human docs
      - .users/docs/ko/      # Korean mirror
    optional_dirs:
      - .agents/progress/
      - .agents/work/
      - packages/
      - src/

  app_os:
    description: "Full application / OS repos — user-facing product with community contributors"
    examples: [naia-os]
    visibility_default: public
    required_dirs:
      - .agents/context/
      - .users/context/      # English mirror (primary)
      - .users/context/ko/   # Korean mirror
    optional_dirs:
      - ".users/context/{lang}/"  # additional community languages
      - .users/guides/
      - .users/workflows/
      - docs/
      - work-logs/

# ─── Mirror Patterns ─────────────────────────────────────────────────────────

mirror_patterns:
  dual:
    applies_to: "workspace_adk (private fork), early-stage runtime_library"
    layers:
      - path: .agents/context/
        format: "JSON/YAML"
        lang: English
        role: AI SoT
      - path: .users/context/
        format: Markdown
        lang: "fork default lang (declared in FORK.md → default_lang)"
        role: human mirror
    rule: "Changes in .agents/ must propagate to .users/ before commit"

  triple:
    applies_to: "app_os"
    layers:
      - path: .agents/context/
        format: "JSON/YAML"
        lang: English
        role: AI SoT
      - path: .users/context/
        format: Markdown
        lang: English
        role: English human mirror (primary)
      - path: .users/context/ko/
        format: Markdown
        lang: Korean
        role: Korean mirror
    additional_langs: ".users/context/{lang}/ — community-contributed, opt-in"

  public_workspace_adk:
    applies_to: "public workspace_adk base (naia-adk)"
    layers:
      - path: .agents/context/
        format: "JSON/YAML"
        lang: English
        role: AI SoT
      - path: .users/context/
        format: Markdown
        lang: Korean
        role: Korean human mirror (primary)
      - path: .users/context/en/
        format: Markdown
        lang: English
        role: English human mirror
    rule: "Update the machine source first, then keep both human language paths aligned."

  split:
    applies_to: "runtime_library using docs/ as primary (naia-agent pattern)"
    layers:
      - path: .agents/context/
        format: "JSON/YAML"
        lang: English
        role: AI SoT
      - path: docs/
        format: Markdown
        lang: English
        role: English SoT for humans
      - path: .users/docs/ko/
        format: Markdown
        lang: Korean
        role: Korean mirror
    rule: "'Edit English first' — docs/ must be updated before .users/docs/ko/"

# ─── Multi-tool Harness ──────────────────────────────────────────────────────

harness:
  description: "Entry-point files are stable repository indexes and must be identical in content"
  canonical: AGENTS.md
  mirrors:
    - CLAUDE.md    # Claude Code
    - GEMINI.md    # Gemini CLI
  allowed_content: "repository identity, mandatory index paths, context routing, session-contract/handoff locations, permanent safety boundaries"
  forbidden_content: "current goals/issues/phases, requirements, implementation plans, completion state, product copy, session-specific lessons"
  session_contracts: ".agents/session-contracts/ — schema tracked; runtime contracts and .session-map.json local/ignored"
  progress_boundary: ".agents/progress/ is execution evidence and handoff state, never mutation authority"
  context_output_boundary: "background context is not artifact content without explicit atom-level derive/quote/require authority for the declared output audience"
  sync_mechanism: ".claude/hooks/sync-entry-points.js --check validates AGENTS.md; node .claude/hooks/sync-entry-points.js synchronizes supported mirrors"
  rule: "Validate the canonical candidate first; never let a tool-specific mirror overwrite AGENTS.md"
  minimum: "AGENTS.md + CLAUDE.md + GEMINI.md acceptable for early-stage repos"

# ─── SDLC Artifact Lifecycle ─────────────────────────────────────────────────

sdlc_artifacts:
  progress:
    dir: .agents/progress/
    gitignored: true
    format: "{issue-slug}-{YYYY-MM-DD}.md + {issue-slug}.json (paired)"
    lifecycle:
      active: "remains in .agents/progress/ while work is ongoing"
      done_criteria: "2+ objective signals (e.g., PR merge AND issue close AND/OR deploy)"
      done_action: "move to .agents/progress/archive/YYYY-MM/"
      ai_self_declare_forbidden: true  # AI cannot unilaterally declare done
      max_active_days: 30              # stale entries → user decides
    no_commit: true  # session-local; never committed to repo

  work_logs:
    dir: work-logs/{username}/
    gitignored: true
    lang: any   # personal notes — no language restriction

  work_temp:
    dir: .agents/work/
    gitignored: true
    ttl: "30 days — then user decides: keep, archive, or delete"
    content: "scratch scripts, temp analyses, intermediate artifacts"

# ─── RBAC Tiers ──────────────────────────────────────────────────────────────

rbac_tiers:
  base:   # naia-adk baseline — T0~T3
    T0:
      name: public
      description: "Public-safe — no secrets, no PII"
      dirs: ["skills/", "scripts/", "docs/", ".agents/context/", "templates/"]
    T1:
      name: org-general
      description: "Organization general data — internal but not sensitive"
      dirs: ["data-company/", "projects/"]
      gitignore: true
    T2:
      name: org-sensitive
      description: "Sensitive org data — financials, strategy, contracts"
      dirs: ["data-teams/"]
      gitignore: true
    T3:
      name: private
      description: "Personal / user-only data"
      dirs: ["data-private/"]
      gitignore: true

  business_extension:   # naia-business-adk additions
    T2_teams:
      name: team-documents
      description: "Team-specific documents (HR, ops, per-department)"
      dirs: ["data-teams/"]
      gitignore: true
      added_by: naia-business-adk
    T1_skills:
      description: "Business skills — org-internal tools"
      dirs: ["skills/business/"]
      added_by: naia-business-adk

# ─── Multi-project Management ────────────────────────────────────────────────

multi_project:
  description: |
    Rules for {user}-adk and {org}-adk workspaces that manage multiple
    subproject repos under projects/.
  structure:
    projects_dir: projects/
    refs_dir: projects/refs/
    index_file: .agents/context/project-index.yaml
    ref_rule: "projects/refs/ — read-only upstream references; no edits"

  mandatory_context_per_project:
    rule: "Before any action inside projects/<name>/, read that project's AGENTS.md first"
    blocking: true
    trigger: "Entering any subproject directory"
    re_trigger: "Switching between subprojects mid-session"
    substitutes: false  # root CLAUDE.md does NOT substitute per-project context

  fork_project_index:
    rule: "Each fork maintains its own project-index.yaml listing active submodules"
    note: "Per-fork content; do not commit fork-specific entries to upstream"

# ─── Fork Customization ──────────────────────────────────────────────────────

fork_customization:
  mechanism: "FORK.md in fork root"
  required_fields:
    - org_name
    - default_lang     # .users/ mirror default language
    - fork_type        # "org-adk" | "user-adk"
  optional_fields:
    - project_list     # submodules under projects/
    - data_submodules  # data-company/, data-teams/ etc.
    - overrides        # override any section of this standard
  override_precedence:
    "1": "naia-adk defaults (this file)"
    "2": "naia-business-adk additions (only when that lineage is selected)"
    "3": "{org}-adk FORK.md overrides (when present)"
    "4": "{user}-adk FORK.md overrides — highest priority for that fork"
  rule: "More specific fork takes precedence. Overrides are additive unless explicitly replacing."
