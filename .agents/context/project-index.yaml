#
# Naia ADK 워크스페이스 인덱스
# AI가 서브모듈별 규칙과 진입점을 찾는 데 사용
version: "2.0"

workspace:
  type: workspace_adk
  name: naia-adk
  owner: nextain
  org: nextain
  repo: nextain/naia-adk
  visibility: public

# 서브모듈 정의
# 이 워크스페이스가 담은 서브모듈. 포크가 자기 것을 채운다.
# 형태: <이름>: { path, type, description, repo, visibility, rulesEntrypoint, status }
submodules: {}

# 이 워크스페이스 안에 체크아웃된 프로젝트. 포크가 자기 것을 채운다.
# 형태: <이름>: { path, type, description, repo, visibility, rulesEntrypoint, status }
local_projects: {}

# 체크아웃하지 않고 GitHub 에만 두는 저장소. 포크가 자기 것을 채운다.
# 형태: <이름>: { type, description, repo, visibility, usedBy, status }
github_only_repos: {}

on_demand_loading:
  index: .agents/context/.ctx-index.json
  sections:
    - id: naia-adk:development_model_routing
      file: .agents/context/development-model-routing.yaml
      description: "L3 Secretary, L2 Issue Leader, L1 Worker roles and balanced Codex model routing"
      tags: [codex, balanced, roles, delegation, context-budget]
    - id: naia-adk:discord_gateway_operations
      file: .agents/context/discord-gateway-operations.yaml
      description: "Common Discord gateway behavior, context isolation, profile rollback, and deployment overlay contract"
      tags: [discord, gateway, codex, profiles, operations]
    - id: naia-adk:lessons_workflow
      file: .agents/context/lessons-workflow.yaml
      description: "Workflow & process lessons (IDD violations, review, harness-design, destructive-action)"
      tags: [workflow, idd, review, harness, iteration]
    - id: naia-adk:lessons_upstream
      file: .agents/context/lessons-upstream.yaml
      description: "Upstream integration & contribution lessons (fork, rebase, pattern-compliance)"
      tags: [upstream, integration, contribution, fork]
    - id: naia-adk:lessons_platform
      file: .agents/context/lessons-platform.yaml
      description: "Platform, environment & CI lessons (Plymouth, vLLM, Bazzite, naia-os)"
      tags: [platform, ci, environment, testing, vllm]
    - id: naia-adk:lessons_frontend
      file: .agents/context/lessons-frontend.yaml
      description: "Frontend lessons (React, IndexedDB, GitHub API, regex) — all issue-desk"
      tags: [react, indexeddb, github-api, regex, issue-desk]
    - id: naia-adk:lessons_documents
      file: .agents/context/lessons-documents.yaml
      description: "Document extraction lessons — HWP/DOCX/PPTX (read-doc skill)"
      tags: [document-extraction, hwp, docx, pptx]
    - id: naia-adk:gstack_comparison
      file: .agents/context/gstack-comparison.md
      description: "gstack vs naia-adk comparison — completeness, scope, review, verification (sections 1-8)"
      tags: [gstack, code-review, scope, completeness]
    - id: naia-adk:gstack_hooks
      file: .agents/context/gstack-hooks.md
      description: "gstack hook system analysis + all findings (A-E, F1-F10)"
      tags: [gstack, hooks, harness, findings]
    - id: naia-adk:gstack_priority
      file: .agents/context/gstack-priority.md
      description: "gstack improvement priority list (P0-P3)"
      tags: [gstack, priority]
    - id: naia-adk:lessons_craft
      file: .agents/context/lessons-craft.yaml
      description: "AI craft discipline — 4 coding principles, 6 core behaviors, 8 anti-patterns, anti-overengineering, prompting best-practices (transplanted from moai-adk; public/Apache/MIT sources)"
      tags: [craft, discipline, anti-pattern, simplicity, scope, verify, behavior]

# 진입점 우선순위
entrypointPriority:
  - AGENTS.md    # canonical index; CLAUDE.md and GEMINI.md are byte-identical mirrors
  - .agents/context/agents-rules.json
  - .agents/context/ai-work-index.yaml
  - .agents/context/project-index.yaml
  - README.md
