version: 1
status: active
scope: naia-adk session contract recovery across Codex adapters

canonical_recovery:
  authority: "An explicit user directive may amend an existing active contract when the work objective remains bounded."
  command: "node .agents/session-contracts/rebind-session.cjs <existing-contract-id> <current-session-id>"
  sequence:
    - "Read the existing contract, progress record, registry pointer, and target ownership."
    - "Replace the old session binding with the current session id."
    - "Recompute contract_digest from the contract without its digest field."
    - "Write contract, progress, and registry pointer as one recovery transaction."
    - "Verify the resolver reports the current session as bound."

same_host_continuation:
  trigger: "SessionStart whose session id differs from the one bound to an active contract, while the contract owner's lease records this very host process (same PID and start token) — /clear, a compaction restart."
  effect: "The contract is rebound to the new session id automatically, without a grant; audit records session_continued. This is the owner continuing, not a takeover: the same PID and start token cannot belong to anyone else."
  dead_owner: "A contract whose recorded host process has exited (no fresh lease, no live session process) may be reclaimed by any unbound session with the reclaim helper; no approval is required and the audit records granted:false."
  live_foreign_owner: "Refused with owner_session_live. This is the only refusal."
  session_id_shapes: "rebind-session.cjs and the gate accept every host's session id (OpenCode ses_…, Claude Code UUID, Codex)."

adapter_contract:
  codex: "Allow the exact rebind-session.cjs and recovery helper commands for the current session while it is unbound or stale."
  forbidden: ["general harness disablement", "taking a contract from a live foreign host process", "rebinding a contract to a session id other than the caller's"]
