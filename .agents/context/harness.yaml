      - "2026-04-26: AI receives an explicit nudge to write `session_id` into the progress file when bound via P1, strengthening the P0 anchor for resilience."
      - "2026-07-31: unbound UserPromptSubmit exits silently. Binding guidance is available through explicit /harness status, while session-contract-gate preserves mutation safety at the action boundary."

