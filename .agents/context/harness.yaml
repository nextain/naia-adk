# Checklist for verifying harness (hooks + rules + workflow) correctness.
# Use when adding/modifying hooks, rules, or workflow steps.

version: 1

# ─── Architecture (G-OC01: tool-agnostic harness) ─────────────
# 2026-05-18: the harness was refactored from per-tool monolithic hooks
# into a tool-agnostic core, then proven on a second host (pi).
architecture:
  core:
    file: ".agents/hooks/core/harness-core.js"
    role: "host-neutral SoT — session/anti-compact (buildSessionInject, compactReminderMessage) + sanitizers. ZERO host coupling."
  policies:
    files: [".agents/hooks/policies/bash.js", ".agents/hooks/policies/edit.js"]
    role: "host-neutral guard policies (command|data,opts)->{reason}|{block}|{allow}|{postContext}|null. No process.exit, no host I/O envelope."
  host_adapters:
    claude:
      files: [".claude/hooks/_claude-bash-guard.js", ".claude/hooks/_claude-edit-hook.js", "+ thin .claude/hooks/*.js adapters"]
      role: "Claude Code stdin/exit envelope around the shared policies. Behavior byte-identical to the pre-refactor monolithic hooks."
    pi:
      file: ".pi/extensions/naia-harness.ts"
      role: "earendil-works/pi extension — maps pi events (tool_call/before_agent_start/tool_result) to the SAME policies + core. ZERO core change."
  fail_mode_invariant: "HARDCODED per guard, never data: pr-guard fail-CLOSED; the other 5 bash guards fail-OPEN. Preserved on BOTH hosts (adversarially proven)."
  status:
    part1: "COMPLETE — tool-agnostic extraction, byte-identical (golden 8/42/19 + E2E 64 + system 13)."
    part2: "COMPLETE & adversarially 2-consecutive-clean (6 rounds) — policy neutralization + pi adapter + real pi@0.74.1 runtime gate (20/20). Cross-tool goal (same harness on Claude + pi, zero core change) MET & verified."
    partB: "declarative guard_policies schema — design-reviewed 3 rounds -> FIRM DEFER (no sound integrity root for SoT-as-policy; only 2/9 guards qualify; cross-tool goal already met). See .agents/progress/g-oc01-partB-forbidden-actions-plan.md."
  gates:
    - "scripts/run-native-harness-tests.cjs — Windows/Linux native aggregate that accepts only Node entrypoints, invokes them directly with shell=false, and supplies hostile WSL/Bash/MSYS variables; it does not claim to observe every descendant process"
    - ".claude/hooks/beh-supervise.js — Windows Job helper pins transitive CPython to an absolute PE path and verifies sys.platform=win32 plus sys.executable identity before launch"
    - ".claude/hooks/e2e/run.sh — native Linux 64 real-condition contract assertions; never a Windows dependency"
    - ".claude/hooks/e2e/scenario.sh — native Linux 13-step system E2E via real settings.json dispatch; never a Windows dependency"
    - ".claude/hooks/e2e/pi-runtime-e2e.mjs — real pi-runtime gate, 20/20 (prereq: npm i @earendil-works/pi-coding-agent@0.74.1)"

request_contract_integrity:
  status: "opt-in; shared core and lifecycle parity implemented for Claude Code and Codex on native Linux and native Windows"
  config: ".agents/context/request-contract.json"
  schema: "packages/artifacts-spec/schemas/request-contract.schema.json"
  core:
    files: [".agents/hooks/core/request-contract.js", ".agents/hooks/core/request-contract-adapter.js", ".agents/hooks/core/request-contract-review-runner.js"]
    role: "exact prompt hash chain, complete source classification, scope epochs, signed authority receipts, change trace, review chain, completion gate, successful-lineage retention compaction; incomplete lineages remain resume-capable and sticky"
  host_adapters:
    claude:
      registry: ".claude/settings.json"
      adapter: ".claude/hooks/request-contract.js"
    codex:
      registry: ".codex/hooks.json"
      adapter: ".codex/hooks/request-contract.cjs"
  lifecycle_events: [PreToolUse, SessionStart, UserPromptSubmit, PostToolUse, PreCompact, PostCompact, Stop]
  enable: "REQUEST_CONTRACT=on or node scripts/request-contract.cjs enable"
  fail_mode: "governed mode fails closed; default is opt-in so existing projects are not trapped before they provision an external user-presence signer"
  authority_root: "external user-presence signer with pinned public key; hardware/non-exportable truth is an explicit provisioning and signer trust boundary"
  source_capture: "native-user provenance is derived only from an exact registered UserPromptSubmit envelope and never from a caller-supplied origin label; every rejected native prompt envelope, including a valid prompt blocked by duplicate runtime bindings, is preserved exactly with that derived provenance in quarantine before the adapter fails closed; every scope authority must cite a native-user source in addition to its signed user-presence receipt"
  reviewer_boundary: "pre-execution digest-verified reviewer + bundle bytes pinned before native platform isolation: Linux uses anonymous read-only descriptors with bubblewrap PID/network/repository/home isolation; Windows uses a repository/home-external sealed staging snapshot with reparse-point rejection, current-user/SYSTEM-only inherited NTFS ACLs, fail-closed cleanup, a configuration-allowlisted sandbox executable digest, Codex elevated sandbox exact-root policy, no network, and a nested Node permission model limited to reviewer+bundle read and scratch write; reviewer stdout is a closed envelope containing only verdict/finding codes and opaque source/atom/directive/target/criterion/authority/tombstone/change/artifact/edge relationship projections—never text, paths, locators, summaries, or digests; the public review-runner result contains only verdict and opaque run_id while protected storage retains record hashes; trusted runner injects issued binding fields after sandbox exit, then review ingestion consumes one live same-process runner evidence object and requires the remaining semantic review to equal actual reviewer stdout; direct review-JSON ingestion is absent; configuration-pinned reviewer and runner attestor snapshots bind their digests and review-payload digest; writer host and reviewer PID plus platform-native process identity must differ; Linux uses kernel boot/start identity and Windows binds a runner-generated per-execution reviewer identity; runner-owned reviewed_at and non-reflective rejected output; ingestion revalidates exact canonical contract coverage inside the private bundle and every current/prior opaque scope projection plus all issue-time bindings; two counted Clean rounds require distinct reviewer contexts/processes; private bundle removed after ingestion, expiry, or corrupt/orphan manifest; POSIX enforces mode 0600 and Windows validates a non-symlink regular file before sealing"
  atomicity: "repository + lineage locks with complete-owner atomic publication, directory-identity verification, serialized process-start-aware stale takeover, Windows host identity from native process start time at SessionStart and lock takeover with the bound identity reused for later lifecycle events (no writable disk cache), fsynced file/parent create-replace-unlink ordering, fail-closed unit/quarantine listing and recursive workspace traversal, strict bounded numeric configuration, strict Git command/parse failures, collision-free platform-native workspace path keys, Windows workspace modes normalized from the Git index instead of meaningless POSIX stat bits, recursive Git-tree genesis baseline, transaction-recoverable lifecycle-state/head replacement, head-pinned lifecycle-state/baseline/genesis-workspace digests, exact prompt-partition obligation atoms carried through every target/criterion/REQ/UC/UC-test/FE/FE-test/implementation/evidence and atom-specific trace edge, sticky governance while any uncompacted/staged unit or unconsumed quarantine exists, validated successful-workspace handoff into each new lineage, disable-command rejection during sticky governance, three exact private pre-binding control-input paths via Claude Write/Edit or strict single-file Codex apply_patch plus shell-metacharacter-free exact Node command parsing and pinned review executables to avoid bind/review self-deadlock, prepared crash-recovery source/bind/review/resume/session/state transactions, session-owned Stop-time canceled mutation-lease reconciliation with review issuance blocked while any unrelated lease is active, native-stdin event presence/equality and event-specific Codex lifecycle stop envelopes, Claude/Codex apply_patch preflight parity, destination-bound and retry-idempotent quarantine adoption, canonical immutability of disposed directives and all tombstones, one mixed-operation pending authority transaction, digest-protected invocation manifests including writer process identities, repository-locked double completion validation with a review-bound completion proof, non-counting proof-generating/blocking native PreCompact plus one-time client/session/proof-bound authorization consumed by PostCompact, proof-verified double-validated handoff-aware successful retention compaction that journals the exact receipt, atomically stages the unit, revalidates the full staged proof after restart, and only then removes consumed quarantine/private state, compaction-persistent global review/run/context/process/execution ID claims, and random retry-stable non-sensitive compaction receipt IDs"
  honest_limits:
    - "disabled hooks and untrusted host hook configuration are outside enforcement"
    - "a coordinated actor able to rewrite all local records is outside the local integrity model"
    - "external side effects and mutations fully completed and reverted between observed hook boundaries may be invisible"
    - "the core verifies signed user-presence/non-exportable assertions but cannot independently attest the external signer's hardware properties"
    - "deterministic parity covers the tracked native adapter processes; installed host-client dispatch is separate operational smoke evidence; Windows support never depends on WSL, Cygwin, MSYS2, a Linux VM, or a Linux container"

requirement_review_trace:
  status: "always-on; independent of the opt-in request-contract runtime above"
  purpose: "the RCI requirement files claim four-stage review evidence; this makes the claim falsifiable without the governed runtime being enabled"
  scripts:
    scope: "scripts/request-contract-review-scope.cjs"
    validator: "scripts/validate-request-contract-requirements.cjs"
    issuer: "scripts/issue-review-receipt.cjs"
  store: ".agents/requirements/reviews/ (receipt JSON + verbatim reviewer transcripts under logs/)"
  binding: "a stage names receipt ids, not a free-text label. Each receipt must exist, carry a Clean verdict with zero findings from the stage's minimum distinct reviewers, preserve each reviewer's untouched transcript and re-hash to it, list only requirements its reviewers reported COVERED, and match the scope_digest of the tree it judged. The digest is derived from git ls-files, and excludes the reviews lines and the receipt store so that recording a verdict does not invalidate it. Editing reviewed content after a round moves the digest and voids the receipt, which is how review-pass's 'any later revision restarts the Clean streak' becomes mechanical rather than honour-system."
  honest_limits:
    - "the receipt store is an ordinary Git-tracked directory: an agent with write access can forge a receipt together with a matching fabricated transcript, and both hash checks will pass. What this closes is the cheap failure — declaring review evidence that was never produced, or keeping a verdict alive across edits to the reviewed code. Closing forgery itself requires the opt-in runtime above, whose reviewer runs under bubblewrap isolation and whose receipts are signed from a process identity distinct from the writer."
    - "the reviewed file set is derived from three sources: tracked paths naming the feature, every code/test path the requirement files themselves declare in their trace, and a short declared list for the governing skills and the review machinery. A reviewed file reachable by none of the three sits outside the digest until it is traced or declared; every declared or traced path fails closed if untracked. This cannot infer intent, but it no longer depends on remembering to extend a hand-kept list when the implementation grows."
    - "reviewer identity is tool+model. Two runs of the same model do not count as two reviewers, by design; the caller must supply distinct reviewers to reach quorum."

# ─── Verification Checklist ───────────────────────────────────

checklist:
  - id: H1
    name: false_positive_test
    description: "Does the hook block things it shouldn't?"
    how_to_verify:
      - "Write 5 test cases: 3 that SHOULD pass, 2 that SHOULD block"
      - "Run each with: echo '<json>' | node .claude/hooks/<hook>.js"
      - "Verify exit behavior and output JSON"
    common_failures:
      - "Regex matching quoted strings (e.g. echo 'git reset --hard' triggering destructive-git-guard)"
      - "Path matching too broadly (e.g. a file named 'design-notes.md' in a non-design dir)"

  - id: H2
    name: root_cause_vs_symptom
    description: "Is the hook treating root cause or suppressing symptoms?"
    how_to_verify:
      - "Ask: 'What behavior does this hook prevent?'"
      - "Ask: 'Can the undesired outcome still happen through a different path?'"
      - "If yes → the hook is symptom suppression, not root cause treatment"
    example:
      symptom_suppression: "Block 'git reset --hard' (symptom: destructive action)"
      root_cause: "Require user confirmation before any destructive action (root: missing checkpoint)"

  - id: H3
    name: scope_check
    description: "Does the hook scope match its intent?"
    how_to_verify:
      - "PreToolUse: does it fire BEFORE the action? Is that early enough?"
      - "PostToolUse: does it fire AFTER? Is it too late (irreversible action already taken)?"
      - "Rule: hooks that prevent irreversible actions MUST be PreToolUse"

  - id: H4
    name: process_vs_action_constraint
    description: "Is there a process constraint paired with every action constraint?"
    how_to_verify:
      - "For every 'you cannot do X' rule, check: 'what SHOULD the AI do instead?'"
      - "If no positive alternative is defined → the rule is incomplete"
    example:
      incomplete: "NEVER change design decisions"
      complete: "NEVER change design decisions. If design differs from implementation → follow escalation_path"

  - id: H5
    name: permission_model_coverage
    description: "Is the AI's role (implementer vs reviewer) clearly defined for each file type?"
    how_to_verify:
      - "Check agents-rules.json permission_model covers all file types the AI touches"
      - "Verify design_doc_paths is up to date"
      - "Test: design-doc-guard.js blocks edits to docs/design/ files"

  - id: H6
    name: escalation_path_defined
    description: "For every 'stop and report' rule, is the escalation path explicit?"
    how_to_verify:
      - "Check agents-rules.json escalation_path covers: design_gap_found_during_build, design_flaw_found_during_review"
      - "The path must be: find → report → wait. Not: find → silently fix"

  - id: H7
    name: review_quality
    description: "Are iterative reviews using /review-pass with adversarial framing?"
    how_to_verify:
      - "Check IDD workflow review and post_test_review phases reference '/review-pass'"
      - "Check /review-pass skill exists at .agents/skills/review-pass/SKILL.md"
      - "Verify two-consecutive-clean-pass rule is enforced"

  - id: H8
    name: original_request_integrity
    description: "Can a review or completion claim silently omit, reclassify, or narrow any original or later user directive?"
    how_to_verify:
      - "Replay missing-genesis, source deletion/tamper, later-directive, scope-removal, stale-review, and client-parity fault cases"
      - "Require every actionable source to map through requirement, use case, use-case test, feature, feature test, implementation, and evidence"
      - "Require signed user-presence authority for initial binding and every scope epoch transition"
      - "Require two current, distinct, externally signed exact-coverage Clean receipts over the complete private review bundle"
      - "Run node .claude/hooks/test/run-request-contract-test.js and the real client registration smoke tests"

