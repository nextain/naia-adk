# ─── Design / Proposal Review Questions (G-AB01) ──────────────
# Absorbed from harness-books Book1 Appendix A.8 (proposal review set, L106-119).
# Source brief: .agents/progress/harness-books-integration-findings-2026-06-18.md (section A).
# H1-H7 above review OUR HOOKS' quality. The questions below review an AGENT/HARNESS
# DESIGN PROPOSAL (a different artifact). H5 (permission_model_coverage) partially
# overlaps SA2; the rest are new coverage. Use at: new harness/agent design PR,
# IDD Plan-gate, or when absorbing an external harness.

design_review_questions:
  source: "harness-books Book1 Appendix A.8 (L106-119)"
  applies_to: "agent/harness design proposals (hook quality is covered by H1-H7)"
  questions:
    - id: SA1
      q: "Which behaviors are constrained by prompt, and which are enforced by runtime?"
    - id: SA2
      q: "Who blocks tool misuse, and at what layer?"
    - id: SA3
      q: "When is context compacted, and how are work semantics (plan / skills / key files / tool state) reconstructed afterward?"
    - id: SA4
      q: "Are prompt-too-long and max-output-tokens recovered differently?"
    - id: SA5
      q: "After an interruption, how is transcript consistency maintained with tool results?"
    - id: SA6
      q: "In multi-agent flows, who owns synthesis and who owns verification?"
    - id: SA7
      q: "Does failure recovery include circuit breakers and anti-loop guards?"
    - id: SA8
      q: "How does the team audit what the agent did and why?"
  red_flag: "If answers frequently reduce to 'we can add that later', the runtime is likely not truly designed yet."

# ─── Current enforcement state (2026-08-15) ───────────────────
# Recorded here because the released state differs from what AGENTS.md describes.
enforcement_state:
  session_contract_gate: disabled
  disabled_by: [".claude/no-harness", ".codex/no-harness", ".pi/no-harness"]
  effect: "session-contract-gate.cjs returns early and enforces nothing"
  unaffected_guards:
    - "git-push-guard (force push)"
    - "destructive-git-guard (reset --hard against remote refs, history rewrite)"
    - "commit-guard, deploy-guard, email-send-guard, gcs-guard, rdd-experiment-guard"
  why: |
    Measured on a fresh clone with enforcement on: an unbound session is blocked from
    every mutating shell command, including `npm test`, `git commit`, and `mkdir`.
    Read-only shell and ordinary file edits pass. The file-mutation path was already
    widened for this exact reason (see the comment above unboundOrdinaryMutationAllowed);
    the shell path never received the same treatment, so pre-enumeration remains a
    ceiling there.
  doc_divergence: |
    AGENTS.md / CLAUDE.md / GEMINI.md Session Boundaries still state that mutating shell
    commands require a session contract. That text describes the intended design, not
    current runtime behavior. The entrypoints are locked to an approved canonical digest,
    so they were not edited without separate approval.
  removal_conditions:
    - "unbound `npm test` passes with enforcement on"
    - "unbound ordinary commit passes with enforcement on"
    - "force push, remote-ref reset --hard, and governance-file mutation still blocked"
    - "cross-host regression tests pass"
  tracking: "https://github.com/nextain/naia-adk/issues/34"
