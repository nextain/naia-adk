description: |
  원문과 비공개 증거는 mode-0600 로컬 파일에만 두고, exact-text 리뷰를 네트워크·저장소·home에서 격리된 별도 프로세스로 실행하며 닫힌 불투명 결과만 접수한다.
acceptance_criteria:
  - "Sandbox denies network, inherited secret/FD access, repository/home access, symlink escape, and persistent writable storage outside one destroyed scratch."
  - "Reviewer, runner, bundle, payload, process identity, and signatures are pinned and revalidated before ingestion."
  - "Rejected output, stderr, paths, prompt text, summaries, and prompt-derived digests never escape the closed result envelope."
