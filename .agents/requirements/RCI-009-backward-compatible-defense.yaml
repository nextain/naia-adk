description: |
  기존 범위 ledger와 receipt 동작을 유지하고 원요청 선언 이전의 누락을 보완하되 모든 도구 변경을 완전 관측한다고 주장하지 않는다.
acceptance_criteria:
  - "Existing BEH and full hook E2E suites remain green with request-contract disabled by default."
  - "Documentation states host trust, coordinated local rewriting, between-hook reversion, signer trust, and external-side-effect limits."
  - "Windows runs the native harness without WSL, Cygwin, MSYS2, a Linux VM, or a container; supervised descendants are bound to a kill-on-close Job Object before execution and confirmed empty after termination."
  - "The Windows Job helper resolves CPython to an absolute native PE executable, verifies its win32 runtime identity, and rejects PATH command wrappers or WSL/Cygwin/MSYS redirection."
  - "Enabled BEH gates fail closed on malformed input, missing cores, and unexpected runtime errors; wrapper and launcher exceptions require exact trusted relative entry points rather than matching basenames."
  - "Handshake validation requires a finite timestamp, recorded settings hash, and readable current settings hash; launcher registration accepts only exact relative Node hook paths with no trailing arguments."
  - "Supervised commands preserve argv boundaries without shell reconstruction on Linux or Windows, and lease publication is serialized with dead-owner recovery."
  - "Stale lease recovery quarantines the observed lock by unique rename and releases only a nonce-matching owner, preventing concurrent reclaimers from deleting a replacement lock."
  - "Windows lock publication failures retain diagnostics and terminate within the bounded deadline; request-contract evidence and review scope files are normalized to LF for stable cross-platform digests."
