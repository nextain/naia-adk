decisions:
  - "2026-08-04 source-authority correction: the older unbound prose that proposed automatically retrying a changed profile conflicts with later immutable participant-authority and deterministic-context directives. No-prompt means no approval UI; it does not grant stronger recovery authority. Exact-v2 recovery therefore fails to review on any authority or context mismatch."
