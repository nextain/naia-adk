source: human
priority: high
created: 2026-07-30
updated: 2026-07-31
issue_url: "https://github.com/nextain/naia-adk/issues/20"
description: |
  Local operator detail and Discord-visible status are separate allowlisted projections. Service credentials and arbitrary backend output never reach AI children or remote status messages.
acceptance_criteria:
  - "Fixture tokens, prompt secrets, service credential paths, raw commands, and full local paths appear zero times in status, JSON, Discord projection, and safe event output."
  - "A Discord participant can inspect only that conversation; configured operators receive redacted cross-job metadata."
  - "AI child processes receive an allowlisted environment that excludes Discord and service-only credentials."
  - "Unknown event payload or metric keys, summaries above 512 characters, and more than one output-activity event per attempt per second are rejected or coalesced before persistence."
  - "Typed event payloads are at most 2 KiB, event fields use documented closed enums, identifiers use the documented 64-character grammar plus secret-pattern rejection, and metrics are closed to the documented non-negative scalar keys."
  - "Explicit history exposes only allowlisted non-bot authors from one unique operator binding, sanitizes content without persistence, and never includes the bot credential."
