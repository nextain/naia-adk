id: DSO-008
title: "Durable Discord Conversation Coordinator"
title_ko: "지속되는 Discord 대화 관리 세션"
product: naia-adk-discord-sessions
module: conversation-coordinator
status: withdrawn
source: human
priority: critical
created: 2026-08-01
updated: 2026-08-04
issue_url: "https://github.com/nextain/naia-adk/issues/18"
description: |
  This requirement is withdrawn. Live operation showed that the coordinator,
  worker, and result-synthesis chain multiplied failure surfaces and could lose
  responses on timeout. The production coordinator runtime and activation path
  are removed; only passive database compatibility and fail-closed quarantine
  of pre-withdrawal recovery envelopes remain.
acceptance_criteria:
  - "No production config can activate a conversation coordinator; any conversationCoordinator key is unsupported and rejected before service start."
  - "The router contains no coordinator model-turn, delegation, synthesis, or activation branch; direct bounded execution is the only production request path."
  - "The legacy coordinator database table is passive compatibility state and cannot launch, authorize, or alter a new request."
  - "Every pre-withdrawal coordinator recovery envelope is quarantined as recovery_review and is never replayed or upgraded."
trace:
  code:
    - { path: ".agents/skills/manage-discord-sessions/helper/discord-router.mjs", symbol: "legacy coordinator envelope quarantine only", coverage: legacy_compatibility }
  tests:
    - { path: ".agents/skills/manage-discord-sessions/tests/observability-cli-storage.test.mjs", symbol: "DSO-009 reopening a legacy store preserves withdrawn coordinator rows without exposing them", coverage: legacy_compatibility }
  reviews: { planning: "two-agent adversarial review 2026-08-01", development: "two-agent adversarial review 2026-08-01", test: "focused deterministic suite 2026-08-01", integration: null }
decisions:
  - "Withdrawn after live operation showed that coordinator, worker, and result-synthesis turns multiplied failure surfaces and lost responses on timeout. Production branches, the config switch, and new coordinator table creation were removed; existing legacy tables are left untouched and legacy envelopes are quarantined."
