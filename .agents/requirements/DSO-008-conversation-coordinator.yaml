id: DSO-008
title: "Durable Discord Conversation Coordinator"
title_ko: "지속되는 Discord 대화 관리 세션"
product: naia-adk-discord-sessions
module: conversation-coordinator
status: active
source: human
priority: critical
created: 2026-08-01
updated: 2026-08-01
issue_url: "https://github.com/nextain/naia-adk/issues/18"
description: |
  Each authorized Discord DM, guild channel, or thread has one provider-neutral
  coordinator record owned by the local harness. It uses bounded authorized Discord history for dialogue continuity,
  answers ordinary questions, and delegates bounded work to isolated workers.
  Coordinator turns, workers, Discord receipts, and result delivery are
  independent lifecycles so one failure cannot stall later messages.
acceptance_criteria:
  - "A scope stores one local coordinator record bound to a policy revision; Codex and Claude remain replaceable ephemeral workers and model processes need not remain idle."
  - "A coordinator can reply directly or delegate a bounded task. Delegated workers receive no Discord credential and no unrelated channel transcript."
  - "Coordinator turns serialize per scope, while an active worker does not block a later status question, correction, or cancellation request from reaching the coordinator."
  - "Acknowledgement and progress delivery are best-effort and never gate coordinator admission, worker launch, or later messages."
  - "A restart reconstructs coordinator context from bounded authorized Discord history and durable open-work metadata without replaying mutation work; history unavailability degrades context, not admission."
  - "Gateway dispatch durably admits a message and returns without awaiting a model turn, Discord REST delivery, or status projection."
  - "A coordinator delegation and its unique worker intent are stored before spawn; an uncertain mutation handoff requires review without blocking later coordinator turns."
  - "Policy, persona, binding, or permission-epoch changes rotate the coordinator revision before later history is used."
  - "Status reports service health, coordinator health, worker health, and delivery health separately; historical unresolved records are never labeled as an active queue."
  - "A deterministic REST-down scenario proves that a received request still reaches the coordinator and a later message remains processable."
