description: |
  사용자 원문, AI 파생 요구사항, 후보 요구사항의 권위를 구분한다. 파생 요구사항은
  원문을 좁히거나 대체할 수 없고, 그런 변경에는 네이티브 사용자 출처와 서명된
  범위 권한이 필요하다.
acceptance_criteria:
  - "Human sources are accepted only from native-user source-chain records."
  - "Derived sources cite an immutable parent and derivation kind."
  - "Narrow or replace derivations fail without destructive scope authority for their directives."
  - "Generic labels such as 'the whole conversation' do not replace atomic source evidence."
  - "Planning and adversarial review receive a separately identified incident-history artifact; a selected directive excerpt is not represented as the complete history."
