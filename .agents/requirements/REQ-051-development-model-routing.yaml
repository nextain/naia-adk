decisions:
  - "Codex remains the integration authority even when OpenCode executes a HY3 role."
  - "OpenCode is limited to alpha-adk and naia-adk collaboration; it is not the naia-shell or naia-agent execution route."
  - "A reviewer is always a distinct role, session, and execution from the implementer. HY3 high may review HY3 medium output when those execution boundaries differ."
