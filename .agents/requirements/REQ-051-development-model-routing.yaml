updated: 2026-07-25
issue_url: ""

description: |
  The ADK development process must keep Codex as integration authority while
  routing expert, monitoring, orchestration, bounded implementation,
  adversarial review, and translation verification to explicit configurable roles.

acceptance_criteria:
  - "A tracked config defines expert, monitoring, main, sub, adversarial_review, translation, and two translation-review roles."
  - "Expert escalation uses Sol for architecture and high-risk triggers."
  - "Monitoring and user communication use Terra; adversarial review requires Terra high and HY3 high parallel clean passes in different sessions from each other and the implementation session."
  - "Main, implementation, testing, and HY3 adversarial review route through OpenCode with OpenRouter HY3 by default."
  - "Main uses HY3 high; implementation and testing use HY3 medium; HY3 low is reserved for translation only."
  - "Translation uses HY3 low only. Translation review requires parallel clean passes from Claude Haiku and HY3 medium in separate sessions."
  - "The router validates role, runner, model, prompt, and repository and uses argv rather than a shell string."

