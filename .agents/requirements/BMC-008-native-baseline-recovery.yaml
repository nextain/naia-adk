description: |
  A small immutable pre-recovery baseline must report only mapped observations, support rollback and missed-run recovery, and execute natively on Windows without WSL, Bash, or symlink requirements.
acceptance_criteria:
  - "The baseline manifest resolves exact task IDs, fixture and scorer digests, routes, controls, repetitions, denominator, and task-to-gate mappings before execution."
  - "Unobserved gates remain unavailable and cannot imply global GREEN or acceptance."
  - "The Windows runner and verifier use native Node or PowerShell paths with equivalent Linux and macOS adapters."
