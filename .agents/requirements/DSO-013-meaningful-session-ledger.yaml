must_not_change: [no-new-export, no-new-monitor-ui, no-new-control-api, no-raw-prompt-or-tool-persistence]
destructive_approval: null
description: |
  The existing SQLite job ledger records the minimum semantic context needed to
  understand a Discord worker session later: the bounded current request, public
  progress, an explicitly recognized native tool category, and the sanitized final
  result. Existing job and watch commands remain the only operator read surface.
acceptance_criteria:
  - "A completed job can be reopened from the same SQLite ledger and its request, public progress, recognized tool category, and final result remain chronologically distinguishable."
  - "The existing job and watch commands expose those persisted events without a new export, monitor, TUI, database, or schema version."
  - "Assembled prompts, hidden reasoning, raw provider output, secrets, local paths, tool arguments, tool results, and unknown inferred categories are not persisted."
  - "Semantic request, progress, and result text remains local-only and never becomes Discord status projection text."
non_goals:
  - "Add export, a monitor UI, a TUI, or a second event database."
  - "Add stop, start, prompt injection, or another control API."
  - "Add memory, KB compiler, profile, three-layer orchestration, or shell integration."
use_cases:
  - { id: UC_DSO_013_001, statement: "An operator reopens a completed Discord worker job after the ledger is closed and sees the meaningful chronology through the existing CLI." }
use_case_tests:
  - { id: UCT_DSO_013_001, use_case: UC_DSO_013_001, test: "UCT_DSO_013_001 reopens a completed session and reads meaningful chronology through existing CLI" }
features:
  - { id: FE_DSO_013_001, statement: "Persist bounded request, public progress, recognized native tool category, and sanitized final result as distinct local-safe events." }
  - { id: FE_DSO_013_002, statement: "Keep semantic event text out of Discord projection and omit raw or inferred provider details." }
