destructive_approval: null
description: |
  Each source atom declares what it governs, how it affects the work, and whether its
  wording may appear in an artifact. Each requested output target identifies its audience,
  exposure, objective atoms, and content-source atoms so review can reject unauthorized
  context text even when the text is factually correct.
acceptance_criteria:
  - "Every source atom carries subject, effect, and render_policy metadata validated by schema and runtime."
  - "Context, reference, example, conversation, and internal sources always have exactly empty directive_ids; derive or quote grants rendering authority only and never objective authority."
  - "Every verifiable output unit declares kind, audience, exposure, objective_atom_ids, and content_source_atom_ids at symbol/hunk, UI string, or document heading/paragraph granularity."
  - "Agent-workflow background and precondition atoms cannot be content-source edges for product code, UI, or external documentation, even when combined with another atom."
  - "Review-pass checks context/output separation, audience fit, and unjustified product surfaces at every stage."
  - "Explicit user requests to summarize or quote a reference remain valid within the declared audience and derive/quote policy."
  - "Schema v2 is explicit; v1 contracts remain readable in compatibility mode but cannot claim v2 context/output enforcement until migrated."
