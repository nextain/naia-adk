id: DSO-012
title: "Reversible Discord Agent Cutover"
title_ko: "원복 가능한 Discord 에이전트 전환"
product: naia-adk-discord-sessions
module: reversible-cutover
status: active
source: derived
source_provenance: ledger_resolved
priority: critical
created: 2026-08-03
updated: 2026-08-04
source_directives: [USR-009, USR-011]
source_evidence: [USR-009, USR-011]
source_atoms: [USR-009-E05, USR-009-E06, USR-011-E01]
source_kind: derived
derived_from: [USR-009, USR-011]
derivation_kind: expand
change_effect: extend
preserves: [local-session-database, named-instance-identity, independent-supervisor]
must_not_change: [no-cutover-without-verified-rollback, no-code-only-rollback-across-config-schema-change, no-secret-in-manifest]
destructive_approval: null
description: |
  Every schema or runtime cutover first creates an owner-only rollback bundle
  containing the previous executable helper runtime, config, service units,
  source revision, database compatibility evidence, and explicit canary stop
  criteria. Rollback restores code and config together.
acceptance_criteria:
  - "cutover prepare copies the previous executable skill runtime and config, renders service and supervisor units that point at that immutable copy, and records SHA-256 digests in an owner-only manifest. The units bind the same credential-derived token fingerprint and the exact source runtime revision."
  - "Normal managed Linux installation uses the same immutable runtime-artifact builder and verifier as rollback. Both service and supervisor require an explicit managed-systemd launch mode, execute the copied artifact rather than the mutable target checkout, and verify complete artifact markers before token ownership, config reads, observation, or recovery; marker absence is not interpreted as direct mode."
  - "The managed service entrypoint imports only Node built-ins until the complete runtime tree is verified; sibling runtime modules are dynamically evaluated only after that check, so a tampered imported helper cannot execute top-level code during preflight."
  - "service install is a first-install operation unless an existing registration is still bound to the verified rollback source and an active bundle binds the deployed target to the clean candidate controller. An existing service cannot be overwritten or restarted as an upgrade without that verified cutover path."
  - "A successful install establishes the requested service state on every supported path. Linux autoStart=true enables and restarts the managed service while autoStart=false stops and disables it. Because versioned Windows cutover is unsupported, Windows install is first-install only and rejects any existing main-service or supervisor registration before creating launchers; autoStart=true creates and starts a verified Task Scheduler registration, while autoStart=false creates only a disabled Startup fallback and never publishes a runnable main task. Manual Windows stop, restart, disable, and quarantine share one fail-closed task-containment transition that verifies disabled state where requested and requires either a successful Task Scheduler End operation or durable owned-service stop evidence."
  - "The first managed cutover may adopt only the exact supported legacy mutable registration: prepare verifies its owner-only service, supervisor, and timer bytes; canonical Node and backend executables; token credential; registration state; owned live process when active; and idle ledger, then binds those unit digests in the rollback manifest. Install rechecks the same legacy bytes before replacement."
  - "Prepare runs from a separate clean candidate revision before target upgrade, requires clean candidate and target Discord runtime trees, and binds the prior source revision plus Git runtime-tree ID to the copied runtime digest."
  - "The manifest records source revision, prior config schema, observed database schema, rollback runtime maximum database schema, a preserve-database policy, and a receipt proving the preserved config was accepted by the materialized source runtime's actual loader; prepare and restore refuse an incompatible config or database."
  - "cutover verify re-hashes config, runtime, and every unit and fails closed on any mismatch."
  - "An operator invokes prepare, verify, canary, and rollback through the same absolute CLI path in the separate clean candidate checkout. Every phase verifies that controller checkout is still at the manifest candidate revision and Git runtime-tree ID with a clean Discord runtime tree; no phase depends on executable bytes in the mutable target checkout."
  - "cutover rollback re-verifies the active bundle before mutation, stops the instance, refuses any nonterminal job before and after the stop and again after unit installation, atomically restores the previous config, installs the versioned service and supervisor units, and only then restarts the instance. Callback failure is propagated and later phases do not run."
  - "Canary is strict: continue requires a verified active bundle; exact installed service, supervisor, and timer unit bytes; enabled and active Linux service and timer registrations; a fresh independent supervisor; and a live owned service. The canary job's accepting and executing generations, current service generation, and supervisor generation must be exactly equal, not merely share a revision. The real router admission must durably bind schema v2, named instance, agent/workspace identity, current context hash, participant binding and authority revisions, config revision, and read-only access; canary recomputes and exactly compares that host evidence. The job must complete with confirmed acknowledgement and final delivery, and the supervisor snapshot must be observed no earlier than the final job update. Missing, stale, fabricated, malformed, disabled, nonterminal, recovery-review, approval-UI, generation-mismatched, or unconfirmed evidence produces stop."
  - "Historical recovery-review or delivery attention remains visible but does not permanently veto a later healthy canary; only current service, Gateway, canary-job, registration, or supervisor faults stop that cutover."
  - "Containment commands that inspect or stop an installed registration do not parse candidate configuration first. A malformed candidate config cannot disable service status, stop, or disable."
  - "The independent observer uses one oldest-first operational snapshot capped at 256 jobs, backed by partial lifecycle and attention indexes plus an aggregate active count, so terminal history is not projected row-by-row on the minute path and active overflow is explicitly unhealthy."
  - "Failed install preparation removes a verified runtime artifact only when no installed unit references it. Artifact list/prune is an explicit owner action that retains the installed artifact and active rollback bundle, removes only re-verified orphans, and never runs from the observer. Install, cutover prepare, rollback, and prune serialize on one per-instance Linux kernel flock held by a parent-lifetime helper, so a stale inventory cannot delete an artifact concurrently becoming installed or active and process death releases ownership without a stale-record reclamation race or readiness-marker leak."
  - "Managed Linux service ownership is keyed by a SHA-256 fingerprint of the loaded Discord token rather than configured bot ID. The service re-derives and verifies that fingerprint, acquires the same owner record as direct and Windows launches, reclaims only an objectively missing same-boot owner PID, and rejects a Gateway READY identity that differs from configured bot ID."
  - "Startup failures expose only bounded reason codes in journald and the independent supervisor snapshot."
  - "Windows versioned rollback is explicitly unsupported rather than partially emulated."
  - "Generic named-instance support does not complete USR-011's separate OnMam agent obligation. That live migration is deferred and remains incomplete until a separately controlled OnMam rollout records its schema-v2 instance config, unique service and Gateway identity, strict read-only canary with confirmed acknowledgement and final delivery, and verified rollback receipt."
non_goals:
  - "Automatically roll back without an operator command."
  - "Copy or rewrite the durable Discord job database during rollback."
  - "Perform or claim the deferred OnMam live-instance migration as part of this canonical harness implementation change."
decisions:
  - "Prefer a complete local executable artifact over relying only on a Git revision that may not be checked out."
  - "The user's rollback and extra-watcher ideas are design inputs rather than mandates: select one independent deterministic observer plus manual verified rollback because extra model watchers share failure domains and increase state complexity."
  - "Keep rollback manual and deterministic; the 60-second supervisor observes but never mutates service state."
  - "Treat each live named-agent migration, including OnMam, as a separate operational delivery with its own evidence; canonical capability and deterministic tests are not rollout evidence."
