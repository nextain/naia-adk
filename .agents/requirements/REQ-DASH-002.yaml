  - "scripts/adk-board.test.mjs, scripts/work-now-board.test.mjs, scripts/work-ledger/{ledger,drive,due-integration,due-timer,human-wait}.test.mjs 전수 통과"
  - "tests/adk-v200.test.mjs의 작업 문서 일정(마일스톤:, 기한:, ## 할 일) 검사 통과"
  - "packages/dashboard/app/docs/decision-list.render.test.tsx의 대기/완료 표 파싱 및 오류/이스케이프 처리 통과"
  - "빈칸 목록(work/page.tsx & board 프록시 시험 없음, decisions/page.tsx 상태·저장 시험 및 인라인 확정 미구현, ScheduleView·TimelinePanel·/board-waits·/board-schedule·/schedule-personal 미병합, work-ledger↔/work E2E 연결 없음)이 명확히 기록된다"
