architecture_fit:
  original_request: "모든 서비스와 기능은 문서화·시험·회귀시험이 가능해야 하며 상위기획부터 통합시험까지 문서 사슬을 갖춘다."
  parent_structure: "packages/dashboard Next.js BFF(:3142) + packages/server Fastify Portal API(:3141) + .agents/requirements 사슬"
  acceptance_rationale: "기존 REQ-WAKE-001 양식과 docs/design/dashboard-plan.md 상위 기획 아래 화면 점검 1-1·1-3 전 기능, API/파일 원천, 실제 시험과 빈칸을 연결한다."
description: |
  [목적]
  사용자가 터미널·Git·파일 시스템을 직접 열지 않고도 PC와 모바일(테일넷) 브라우저에서 ADK·회사·연결 데이터 폴더의 문서와 파일을 탐색·검색·열람·편집하고, 특정 문장이나 문서 전체에 메모를 남겨 AI와 협업하며, 긴 문서 경로 대신 짧은 주소(/d/<키>)로 즉시 공유·열람할 수 있게 한다. 동시에 Host 검사, 프록시 신뢰 판정, Origin 검증, 경로 탈출·숨김·하드링크 차단으로 비인가 접근과 비밀 노출을 막는다.

  [기능 목록 (화면 점검 1-1 · 1-3 + 접속 검사 · Mermaid 뷰어)]
  1. 창 제목(<title>) & 좌측 브랜드 링크 (/docs 이동): layout.tsx, Nav.tsx (비고: 인스턴스별 브랜드 설정 연동은 미연결).
  2. 상단 핵심 탭 (문서·결정·작업): Nav.tsx (origin/main은 문서·결정·작업, 운영 3142는 문서·일정·작업).
  3. '보기' 설정 (화면 테마 라이트/다크/시스템 · 글자 크기 4단계 및 localStorage 유지): theme-prefs.ts, Nav.tsx, layout.tsx (운영 3142 ViewSettings의 '또렷하게'·고대비·색상은 origin/main 미병합).
  4. '문서 검색' + '보관 문서도 찾기' (archived=1): DocsView.tsx, tabs.ts searchApiUrl, GET /api/portal/search.
  5. 좌측 사이드바 ('폴더 목록', 모바일 접기/펼치기): DocsView.tsx (데스크톱 접기·리사이저는 origin/main 미병합).
  6. 문서 탭 분리 (공통 / 브랜드·마케팅 / 개발자 / [분류 안 됨]): tabs.ts (운영 3142의 4번째 '사업' 탭은 origin/main 미병합).
  7. 좌측 폴더 트리 & archive / 지난 기록 보관 폴더 정렬·배지: DocsView.tsx, tabs.ts orderArchiveLast.
  8. 폴더 격자 보기 (500개 상한·커버 이미지): FolderGrid.tsx, kinds.ts, GET /api/portal/folder (운영 3142의 목차/목록/썸네일 전환은 origin/main 미병합).
  9. 다중 선택 '편집' 모드 (일괄 zip 내려받기): origin/main 미구현 (운영 3142 select-mode-toggle 기능).
  10. 문서 본문 보기 · 편집(ETag 409 충돌 방지 · readOnly/data: 차단) · 즐겨찾기(200개 상한) · [짧은 주소]: DocsView.tsx, DocEditor.tsx, Favorites.tsx, ShortLinkButton.tsx, GET/PUT /api/portal/doc, /api/portal/favorites (운영 3142의 '이 폴더 파일 목록'·'인쇄·PDF'·RichDocEditor 3탭·Mermaid 확대 뷰어는 origin/main 미병합/미구현).
  11. 문서 상단 게시 승인 상태 (PublishReview): origin/main 미구현 (운영 3142 기능).
  12. 문서 짧은 주소 (/d/<키>, /d/<출처>/<경로>, POST /d, CLI short-link.mjs): short-links.mjs, server.mjs handleShortLink, scripts/short-link.mjs, config/short-link.example.json.
  13. '메모 열기 (N)' 배너 & 인용 메모 패널 (추가·수정·답변·해결·다시 열기·삭제): NotesBanner, NotesPanel.tsx, notes.ts, /api/portal/notes*, scripts/doc-notes.mjs.
  14. 파일 보기 (이미지 확대/폭맞춤·동영상·오디오·PDF·텍스트 1MB·미지원 파일 내려받기, Range 206): FileView.tsx, GET /api/portal/asset, GET /api/portal/text (운영 3142의 이전/다음 파일 탐색은 origin/main 미병합).
  15. 접속 검사 및 데이터 폴더 경계: hostGuard(421), middleware.ts, server.mjs validatePortalPathname(400)/buildProxyHeaders, security.ts evaluateTrust/writeProxySecret, portal.ts 하드링크(nlink>1) 404·숨김/탈출 차단·Origin 불일치 403, view-folders.ts & scripts/view-folders.mjs.

  [사용자 시나리오]
  - UC-DASH-001-1 (문서 탐색·편집): 사용자가 /docs에 접속해 탭과 트리로 문서를 열고, 즐겨찾기 추가 후 편집기에서 내용을 고쳐 저장하면 ETag 일치 시 저장되고 동시 수정 시 409 충돌 안내를 받는다.
  - UC-DASH-001-2 (인용 메모 협업): 사용자가 본문 문장을 선택해 [메모]를 등록하면 상단 '열린 메모 N건' 배너와 문서 옆 메모 목록에 표시되고, AI 답변 후 해결/다시 열기를 전환할 수 있다.
  - UC-DASH-001-3 (짧은 주소 공유): 사용자가 [짧은 주소] 단추 또는 short-link.mjs CLI로 /d/<키>를 발급받아 모바일에서 열면 302 리다이렉트로 원래 탭·출처·문서가 열린다.
  - UC-DASH-001-4 (파일 미리보기·검색): 사용자가 이미지·PDF·텍스트·영상 파일을 미리보고 내려받으며, 검색어와 '보관 문서도 찾기'로 보관함 문서를 포함해 검색한다.
  - UC-DASH-001-5 (접속·보안 차단): 허용 목록 밖 Host 헤더(421), 경로 탈출(400), 비신뢰 peer의 data: 접근 및 교차 출처 쓰기(403), 하드링크(404)가 모두 차단된다.
acceptance_criteria:
  - "packages/dashboard 문서·짧은주소·테마·Host 검사 단위/렌더/독립 통합 시험 전수 통과"
  - "packages/server 보안·포털·경로가드·하드링크·검색·데이터폴더·편집/메모/즐겨찾기 통합 시험 및 scripts/view-folders.test.mjs 전수 통과"
  - "화면 응답 텍스트에 내부 /api/ 경로, 파일 시스템 절대 경로, 64자리 SHA-256 해시가 노출되지 않는다 (isSafeVisibleText)"
  - "미구현·미시험 항목(docs/page.tsx 통합 시험, RichDocEditor, PublishReview, 다중선택 zip, 데스크톱 접기, 사업 탭, Mermaid 확대 뷰어, E2E pnpm test 편입)은 빈칸 목록으로 추적한다"
