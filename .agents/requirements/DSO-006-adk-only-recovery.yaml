issue_url: "https://github.com/nextain/naia-adk/issues/20"
description: |
  The core service, settings, recovery state, and observability work from naia-adk alone. Codex and Claude are independent optional execution backends.
acceptance_criteria:
  - "All canonical configuration and recovery state live under naia-settings, except secret values held by an OS security facility and referenced by name."
  - "The skill derives a canonical ADK root, creates config as mode 0600 and the session directory as mode 0700 at the documented workspace-relative paths, and rejects Agent/Shell core references."
  - "Agent and Shell are absent from the core dependency graph."
  - "Removing Codex leaves Claude visibility and recovery working; removing Claude leaves Codex visibility and recovery working."
  - "delivery_unknown is visible after restart and is never automatically resent."
  - "An actual reboot starts exactly one helper owner, resumes or explicitly reconnects Gateway, keeps the same jobId with a new attemptId and recovered event, and posts at most one recovery notice per boot generation."
  - "Recovery never launches a child with encrypted historical command options: it compares a safe permission-profile epoch and builds a fresh no-prompt invocation."
  - "Windows uses native ACL validation, process creation identity, an owner-only launcher, and one limited ONLOGON Task Scheduler service without Bash or systemd."
