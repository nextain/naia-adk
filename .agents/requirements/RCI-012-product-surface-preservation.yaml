description: |
  기준 커밋의 사용자 관찰 표면을 프로젝트 중립적인 capability probe로 동결한다.
  추가·통합·확장은 기존 표면을 보존하며, 대체·삭제·비활성화·리다이렉트·
  비호환 migration은 정확한 사용자 권한과 실제 diff digest 없이는 실패한다.
acceptance_criteria:
  - "Every changed or deleted baseline path is owned by a declared logical product surface."
  - "Preserve and extend retain every baseline capability and a reachable successor surface."
  - "Destructive dispositions bind an exact surface, directive, scope digest, authority receipt, and actual diff digest."
  - "Surface kinds and capability identifiers remain project-defined; the core has no web or framework assumptions."
  - "Planning discovery inventory and post-implementation signed observation are separate artifacts; planning never predicts final current-manifest bytes."
