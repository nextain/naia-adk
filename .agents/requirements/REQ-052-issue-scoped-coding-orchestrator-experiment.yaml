decisions:
  - "P0 is a no-runner experiment: its planner/evaluator emits and verifies deterministic receipt evidence only. It does not spawn providers/runners, prove runtime parallelism, or perform real approval verification."
  - "Shell Main coordinates and reports but never executes coding stages; execution belongs exclusively to the bound roles."
  - "External approval is external evidence with pending status, not a capability of any internal role and never inferred from identity proof."
  - "Codex remains the sole integration authority; integration (s11) joins on both clean final reviews (Terra high and HY3 high)."
  - "Reviewer independence is role + sessionId + executionId, not model-family inequality. HY3 high may adversarially review HY3 medium only with all three boundaries distinct."
