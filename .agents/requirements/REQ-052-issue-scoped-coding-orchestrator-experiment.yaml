id: REQ-052
title: "Issue-Scoped Coding Orchestrator Experiment (P0, No-Runner)"
title_ko: "Issue-scoped coding orchestrator P0 no-runner experiment"
product: naia-adk
module: development-process
status: active
source: human
priority: high
created: 2026-07-26
updated: 2026-07-26
issue_url: ""

description: |
  P0 no-runner experiment for an issue-scoped coding orchestrator. A
  deterministic planner consumes the tracked development-models and
  orchestrator configs plus an issue id and scope, and emits a canonical
  plan JSON only. Shell Main is delegate-and-report only and cannot
  execute any coding stage. All coding stages are bound to exact roles:
  Sol (expert) for design, HY3 at high/medium reasoning effort for
  orchestration/implementation/testing, Terra high plus HY3 high as the
  two required independent adversarial reviews, and Codex as the sole
  integration authority. The plan carries a deterministic, secret-free
  role snapshot with content hashes and an 11-step dependency graph.
  External approval is modeled as pending external evidence only - it is
  never satisfied by identity proof and no internal role may execute it.
  Defect routing and hash-based invalidation are declared in the plan. Every
  evaluated stage receipt is additionally bound to an execution-session
  identifier and model-family identifier. Testing must be a separate role,
  session, and execution from implementation. A reviewer must always be a
  different role, session, and execution from every artifact producer it
  reviews. HY3 high may review HY3 medium output when those execution
  boundaries differ; model-family equality alone is not a conflict.
  Explicitly out of scope for P0: the experiment spawns no provider or
  runner process and performs no real approval verification.

acceptance_criteria:
  - "Shell Main is configured delegate-and-report only (mode delegate-and-report-only, executeCodingStages false); binding any coding stage to a shell role fails validation."
  - "Role snapshot declares runner, model, modelFamily and reasoning tier: expert = Codex Sol high; main = HY3 high; sub/testing = HY3 medium; translation = HY3 low only; Terra high and HY3 high are configured adversarial roles; integration authority = Codex."
  - "Wrong runner, wrong model, wrong reasoning-effort tier, or unknown role binding is rejected with a validation error."
  - "The plan is deterministic: canonical JSON is byte-identical across repeated builds and scope-order permutations; no clock or randomness is used."
  - "Secret-bearing input is rejected fail-closed before snapshotting: token/key/secret/password/apikey/baseurl/credentialref keys (including nested) cause a validation error. The evaluator never strips or mutates caller configuration, and secret values never appear in output."
  - "configHash, issueScopeHash, and roleSnapshotHash are sha256 over canonical JSON; changing issue or scope changes issueScopeHash without changing configHash or roleSnapshotHash."
  - "The plan contains exactly 11 steps s1..s11: design -> (review_terra, review_hy3) -> orchestration -> external_approval_evidence -> plan -> implementation -> testing -> (final_review_terra, final_review_hy3) -> integration, with integration joining on both final reviews."
  - "Both adversarial reviews (review_terra, review_hy3) are required and mustAllBeClean is true; a non-clean review invalidates downstream steps."
  - "Each receipt and observation carries exact non-empty role, sessionId, executionId and modelFamily fields and those fields are digest-bound. Implementation and testing must use different role, sessionId, and executionId values, even when their modelFamily is the same."
  - "Orchestration uses a different role, sessionId, and executionId from design and implementation. Each adversarial reviewer and its peer use different role, sessionId, and executionId values from every reviewed artifact producer and from each other. HY3 high reviewing HY3 medium is valid when these boundaries hold."
  - "external_approval_evidence (s5) is created with evidenceStatus pending and externallyVerifiedOnly true, has no bound internal role, is never marked complete by the planner, and identityProofRequired is false (identity proof is not accepted as approval)."
  - "Defect routes send implementation defects to implementation, instruction defects to orchestration, and design defects to design; reruns are role-locked and the evaluator rejects a fourth rerun (maxReruns 3)."
  - "Invalidation policy: output/dependency hash changes invalidate downstream steps; a change to s5 evidence invalidates s6..s11; s9, s10 and s11 must all report clean for release."
  - "Explicit P0 non-goals hold: the evaluator spawns no provider/runner process and does not prove runtime parallelism. It verifies submitted, digest-bound receipt evidence and configured role/session/execution independence only; real approval verification remains out of scope."

acceptance_commands:
  - "node scripts/test-issue-orchestrator-experiment.cjs  # 13 strict planner/evaluator receipt, independence, secret-rejection, and max-rerun tests must pass with exit code 0"
  - "node scripts/issue-orchestrator-experiment.cjs --issue ISSUE-1 --scope src/a.js,src/b.js  # emits a plan; no runner is started"
  - "node scripts/issue-orchestrator-experiment.cjs  # missing --issue must exit 2"

