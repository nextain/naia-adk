destructive_approval: null
description: |
  A local owner can opt into a detailed work trace that explains the observable
  execution phase and safe tool activity under a concise configured profile
  label. Private chain-of-thought remains unavailable and is never persisted.
acceptance_criteria:
  - "`watch --verbose` reads only the local SQLite event ledger and never polls Discord REST for receive activity."
  - "Verbose watch uses the existing owner-only OS-account, config, and SQLite permission boundary and adds no Discord authorization path or second watcher process."
  - "Human verbose output begins with an optional persona.shortName of at most 24 Unicode characters and falls back to the concise instance name, never the long persona name, UUID, or service hash as its primary label."
  - "Codex and Claude normalize provider-exposed reasoning presence into a bounded planning phase and normalize safe tool categories without persisting reasoning text, assistant text, prompts, commands, tool results, environment values, secrets, or absolute paths."
  - "Verbose output distinguishes backend readiness, planning, reading, editing, executing, testing, tool start/finish, result readiness, delivery, failure, known blockers, verification events, elapsed ledger time, and unsupported detail when evidence exists; it never invents a decision summary or next step that the provider did not expose as an allowlisted enum."
  - "Provider free-form decision summaries, blockers, or next-step text remain unsupported because they cannot be proven free of prompt, reasoning, command, result, path, or secret content; the operator view states this limitation rather than persisting or synthesizing them."
  - "Verbose output uses an actionable short job reference accepted by `job <reference>` and fails ambiguous references closed, while JSONL preserves the complete event object and job identity and adds explicit stable instance plus bounded profile metadata."
  - "The existing non-verbose watch stream, job lifecycle, service recovery, Discord status projection, and schema-v1/v2 configs without persona.shortName remain compatible; changing only shortName does not change execution authority/configuration revisions or recovery eligibility."
  - "Invalid, control-bearing, bidirectional, secret-like, path-like, bracketed, blank, or oversized profile labels fail configuration validation."
  - "Automated tests cover Codex, Claude, missing-detail fallback, named instances, invalid labels, raw-content non-retention, JSONL compatibility, CLI argument conflicts, owner-only state, restart/recovery compatibility, and rollback snapshots before and after shortName."
  - "Skill and design documentation distinguish safe phase metadata from unavailable private chain-of-thought; deterministic complexity preflight, full Discord tests, managed rollback preparation, four-instance idle checks, and canary evidence gate deployment."
non_goals:
  - "Expose, decrypt, reconstruct, or infer private chain-of-thought."
  - "Add a second watcher process, provider session persistence, or a raw log archive."
  - "Send progress messages to Discord or change participant authorization."
decisions:
  - "Use the existing append-only safe event ledger and CLI instead of adding an IPC stream or encrypted raw-provider log."
  - "Treat provider-exposed reasoning presence as phase evidence only; absence remains explicit and no free-form reasoning summary is synthesized."
  - "Keep persona.shortName outside execution-profile and recovery authority digests because it is an operator-only presentation label."
