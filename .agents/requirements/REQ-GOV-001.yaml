  - "scripts/worker-runner/runner.test.mjs의 review-cap 2회 차단·reset·lane 격리·wake 노트·CLI 옵션 시험 전수 통과"
  - ".claude/hooks/plan-review-write-guard.test.cjs 및 test/run-approval-plan-gate-test.cjs 전수 통과"
  - ".claude/hooks/drift-guard.test.cjs 및 test/run-protected-paths-test.cjs 전수 통과"
  - "빈칸 목록(agy·codex 3층 세션용 lead-write-guard/plan-review-write-guard 어댑터 미구현 및 운영 핀 체크아웃 동기화 검사 시험 없음)이 기록된다"
