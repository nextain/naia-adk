description: |
  Codex, Claude, and a human operator use the same deterministic skill-local interface to list, inspect, and watch jobs without naia-agent or naia-shell.
acceptance_criteria:
  - "The first slice exposes status, jobs, job <id>, and watch through one script; redacted logs remain disabled until a bounded encrypted artifact contract exists."
  - "A fake job event appears in job detail and watch output within two seconds."
  - "After reboot, the persisted timeline remains queryable before any AI backend is launched."
  - "Every accepted conversation arms one job-local acknowledgement timer immediately after durable admission. The timer is independent of the 60-second supervisor and records operator_response_sent or operator_response_missed exactly once without polling Discord; acknowledgement state never gates worker launch."
  - "An operator can explicitly read history or the latest authorized author response for one exact binding, and can recover one exact attachment with size and optional SHA-256 verification."
  - "An operator with the reply role can send one sanitized owner-only content file to one exact operator binding and receives a confirmed, failed, or unknown receipt without automatic retry."
