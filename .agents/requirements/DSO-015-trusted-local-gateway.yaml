description: |
  A separate, explicit trusted-local profile lets one exact Discord operator use
  the hosting OS user's local authority through Codex, Claude Code, or OpenCode.
  Existing controlled profiles remain the default. Failed terminal jobs retain
  their encrypted bounded recovery envelope so an authenticated restart can queue
  a replacement without asking the operator to repeat the request.
acceptance_criteria:
  - "Omitting runtime.accessProfile preserves the controlled read-only/workspace-write behavior."
  - "trusted-local requires schema v2, exactly one operator participant, and DM-only operator bindings."
  - "Trusted-local mutation maps to Codex danger-full-access, Claude bypassPermissions, and OpenCode auto without an interactive approval prompt."
  - "A failed job can be restarted from its encrypted recovery envelope and the consumed source envelope is deleted."
  - "Delivery-confirmed, completed, cancelled, and recovery-review jobs do not retain restart envelopes."
  - "An authenticated local operator can submit an exact bounded request through an existing operator binding without bypassing router admission."
non_goals:
  - "Grant root privileges or bypass the hosting OS user's permissions."
  - "Upgrade an existing controlled Gateway implicitly."
  - "Allow arbitrary credential source paths from messenger configuration."
use_cases:
  - { id: UC_DSO_015_001, statement: "One exact operator starts a separate trusted-local DM Gateway while existing controlled Gateways keep their bounded profiles." }
  - { id: UC_DSO_015_002, statement: "An operator restarts a failed terminal job without retyping its original bounded request." }
