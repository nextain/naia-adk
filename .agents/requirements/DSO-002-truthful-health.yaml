id: DSO-002
title: "Truthful Freshness and Activity Health"
title_ko: "신선도와 활동 상태의 정직한 판정"
product: naia-adk-discord-sessions
module: health-projection
status: active
source: human
priority: high
created: 2026-07-30
updated: 2026-07-31
issue_url: "https://github.com/nextain/naia-adk/issues/18"
description: |
  Service liveness, job lifecycle, observed activity, and result correctness are separate signals. Missing evidence must never be presented as healthy progress.
acceptance_criteria:
  - "Status cross-checks persisted heartbeat age and process liveness; a stale snapshot is never reported as running."
  - "waiting_approval, retry_wait, progressing, running_no_detail, suspected_stalled, unresponsive, unknown, and not_applicable remain distinguishable."
  - "Every activity-health value includes a reasonCode, observedAt, and evidence timestamp."
  - "Unsupported backend detail is reported as unsupported rather than inferred."
  - "A fake clock proves the 10-second heartbeat, 30-second stale threshold, 120-second default soft-silence threshold, clock rollback handling, and ownership-conflict precedence."
  - "A health projection that reaches suspected_stalled or unresponsive is consumed by a bounded watchdog action instead of being left as a passive running label."
