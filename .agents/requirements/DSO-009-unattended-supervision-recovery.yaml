description: |
  A conversational agent must not promise continuous Discord polling or delegated-work
  supervision that ends when its turn, context, or child agent ends. Unattended work uses
  a deterministic process outside the model turn, exposes unattended state truthfully,
  and exposes a bounded recovery signal. Routine work authorized by the user is
  always launched with a no-prompt profile; a tool approval UI or waiting state is a
  harness failure, not a user wait state. Semantic control over arbitrary final prose is
  not claimed.
acceptance_criteria:
  - "The skill explicitly refuses to represent interactive AI polling as continuous monitoring; continuous monitoring requires the installed service plus an independent deterministic health check."
  - "Service status distinguishes process heartbeat, durable Gateway evidence, overdue queued or owned work, and result delivery; a fresh heartbeat alone cannot make every component healthy, and absent durable Gateway connection evidence is unknown rather than inferred."
  - "The independent check opens the ledger read-only, is scoped to one named instance, and exits unhealthy only for stopped or stale service or active work exceeding noProgressInterventionSeconds. Historical recovery_review and delivery_unknown records are attention, not permanent service failure."
  - "The per-second watchdog and per-minute observer query at most 256 nonterminal jobs, oldest first, and obtain the total active count plus historical attention through aggregate queries; they never project the append-only terminal history. Any excess active work is reported as unhealthy operational_jobs_truncated rather than silently omitted. Operator job listings are explicitly paged and bounded."
  - "A deterministic observer may atomically persist only its own bounded health snapshot outside SQLite. It never sends Discord messages, replays jobs, changes job lifecycle, restarts a service, or writes the ledger."
  - "The observer is executed independently of both the Discord service and an AI turn every 60 seconds: a separate systemd timer on Linux and a separate Task Scheduler minute task on Windows. Install and reboot tests prove that stopping Discord does not stop snapshot refresh."
  - "Every enabled unattended Codex or Claude configuration explicitly uses approvalPolicy=never. Managed mode or an emitted approval UI fails closed before user-visible waiting state. requiresApproval cannot implicitly select a managed child mode."
  - "Root entry-point summaries and the workflow SoT use internal checkpoints after an already-bounded request and ask only for material unresolved choices. A deterministic mirror test rejects stale unconditional Understand, Scope, Plan, Sync, or Close approval gates."
  - "Effective unattended actions equal allowedActions minus requiresApproval. Prompts and sandbox access use that effective set, so removing managed approval cannot silently expand authority."
  - "Direct and harness-owned worker prompts state that bounded routine authority is already granted and that unavailable authority must be reported as a limitation, without asking for an approval click. Contract tests inspect both prompt paths; they do not claim semantic classification of all model prose."
  - "Foreign collaboration subagents are not reported as supervised unless they publish a harness-owned receipt. The operator documentation states this boundary and requires explicit reconciliation before relying on their result."
  - "Status exposes foreignAgentSupervision=unsupported. Without a receipt interface no per-agent lifecycle is accepted, inferred, or tested."
  - "The production conversation-coordinator runtime, activation branch, and new table creation are removed. Any conversationCoordinator key is rejected; pre-withdrawal recovery envelopes are quarantined and existing legacy tables are left untouched."
  - "Overdue precedence is fixed: queued uses acceptedAt; owned running uses lastProgressAt then startedAt; missing or conflicting owned child evidence precedes time; terminal and historical attention records are excluded; future or missing timestamps are attention/unknown rather than inferred failure."
  - "Gateway ACK freshness uses a separate bounded threshold derived from heartbeat policy, never the configurable work no-progress deadline. waiting_approval is immediately unhealthy; retry_wait, result_ready, and delivering use updatedAt and become unhealthy after the work bound."
  - "Supervisor registration is verified before the main service starts; any partial install failure quarantines the main registration, and service status verifies both the service and supervisor identities."
  - "Fault-injection tests cover stale heartbeat, the overdue precedence matrix, historical ambiguity as attention, the static foreign-agent unsupported capability, effective-action subtraction, managed configuration rejection, approval UI rejection, direct and worker prompt authority, stale entry-point gates, coordinator enablement rejection, observer snapshot ledger preservation, and two scheduler intervals while Discord is stopped."
non_goals:
  - "Model the internal lifecycle of every Codex collaboration subagent."
  - "Add a second model-based watcher or recursively supervise watchers with more agents."
  - "Automatically resend delivery_unknown messages or replay mutation work."
  - "Rewrite the proven Gateway, authorization, encryption, or delivery nonce layers."
decisions:
  - "Prefer one independent deterministic observer over additional AI watchers in the same failure domain."
  - "Use an owner-only, digest-verified rollback bundle created by a separate clean candidate checkout; the candidate's absolute CLI path owns prepare, verify, canary, and rollback so the mutable target CLI is never the recovery controller."
  - "Keep this requirement active rather than verified until native Windows Task Scheduler install/reboot evidence exists; Linux-only rendering and separate-process tests are not relabeled as Windows proof."
