issue_url: "https://github.com/nextain/naia-adk/issues/18"
description: |
  Every accepted job and attempt must keep an append-only, reboot-surviving timeline of safe activity events inside the ADK workspace.
acceptance_criteria:
  - "Events preserve jobId, attemptId, monotonically increasing sequence, kind, occurredAt, safeSummary, metrics, and redaction level."
  - "A reboot or helper restart keeps the same jobId, creates a new attemptId when execution restarts, and appends a recovered event."
  - "Raw prompts, arbitrary stdout, secrets, and complete tool results are not copied into the safe event timeline."
  - "Sequence is monotonic per job, ordinal is monotonic per database, and a stable per-job dedupe key makes an external event retry idempotent."
