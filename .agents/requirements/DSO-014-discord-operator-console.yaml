  - { id: FE_DSO_014_003, statement: "Owner-only control requests support cancel, restart, and bounded prompt amendment." }
  - { id: FE_DSO_014_004, statement: "Evidence levels distinguish fixture integration from installed-runtime proof." }
  - { id: FE_DSO_014_005, statement: "Router-selected Codex cost profiles remain valid across the runner-adapter boundary." }
