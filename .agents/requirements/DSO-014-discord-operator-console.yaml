description: |
  Each named Gateway has an operator terminal that combines current state with a
  durable live timeline. It supports bounded operator cancellation, restart, and
  prompt amendment. Fixture evidence and installed-runtime evidence remain distinct.
acceptance_criteria:
  - "The operator can run monitor and logs --follow for any named instance; terminal jobs remain visible and reopenable."
  - "Pre-attempt failures persist an exact safe stage instead of collapsing into internal_error."
  - "Cancellation, restart, and prompt amendment have durable requests and receipts with explicit backend semantics."
  - "A real installed alpha runtime accepts a bound DM, starts Codex, records progress, and reaches a diagnosed terminal state."
  - "Fixture-only evidence cannot satisfy the installed-runtime acceptance criterion."
  - "The router's validated Codex model and cost profile pass through the real runner allowlist and adapter command builder before fixture evidence can claim backend launch coverage."
non_goals:
  - "Persist hidden chain-of-thought, secrets, unrestricted raw prompts, environment values, or unrestricted tool output."
  - "Integrate naia-agent, memory, KB compiler, or the three-layer assistant in this issue."
use_cases:
  - { id: UC_DSO_014_001, statement: "An operator watches one named agent continuously and can reopen a failed or completed timeline." }
  - { id: UC_DSO_014_002, statement: "An operator cancels, restarts, or amends selected work and receives a durable control receipt." }
  - { id: UC_DSO_014_003, statement: "An installed alpha DM starts the configured backend or leaves an exact safe pre-attempt failure stage." }
use_case_tests:
