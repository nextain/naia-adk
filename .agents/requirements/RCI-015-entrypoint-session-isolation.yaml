description: |
  Shared tool entry files are stable repository indexes, not work contracts. A shared
  resolver binds each client session to one explicit active contract and returns a
  deterministic failure state for missing, duplicate, stale, cross-project, or
  digest-mismatched bindings. Progress records report work but do not replace contracts.
acceptance_criteria:
  - "AGENTS.md is the canonical index; validation rejects current goals, issue state, implementation plans, completion claims, and product copy before any declared mirror is updated."
  - "Injection and mutation adapters consume the same resolver result and never select the first duplicate match."
  - "A new session does not join the repository's only unfinished strong request-contract without an explicit binding."
  - "A parent workspace contract cannot bind a nested project, and a nested contract cannot bind its parent."
  - "Legacy progress-only and Markdown bindings remain readable for migration diagnostics but cannot authorize mutation."
  - "The lightweight session-contract schema, local binding registry, contract digest, contract session_bindings, and progress contract reference must all agree before mutation is authorized."
  - "Concurrent active contracts declare target_ownership paths; overlapping ownership is AMBIGUOUS and blocks mutation."
  - "Direct file tools must resolve entirely inside allowed_paths and target_ownership; non-read-only shell runs only as exact digest-bound whole-command authority in allowed_shell_commands, with post-run review responsible for side-effect conformance."
  - "Template process-status.current_work and unknown legacy fields are preserved field-for-field and value-for-value in migration evidence, while legacy state remains read-only during the compatibility period."
