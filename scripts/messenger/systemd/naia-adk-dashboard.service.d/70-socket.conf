# Example drop-in for a dashboard unit named naia-adk-dashboard.service.
[Unit]
# Never start without the socket: started alone it binds -p/-H itself and frees the port again on restart.
Requires=naia-adk-dashboard.socket
After=naia-adk-dashboard.socket
# Hitting the start limit would fail the socket too and free the port, so it is off. Retry spacing is the unit's RestartSec.
StartLimitIntervalSec=0
