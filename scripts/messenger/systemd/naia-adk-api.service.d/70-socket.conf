# Example drop-in for an API unit named naia-adk-api.service. Replace the paths with your install.
[Unit]
# Never start without the socket: started alone it binds -p/-h itself and frees the port again on restart.
Requires=naia-adk-api.socket
After=naia-adk-api.socket
# Hitting the start limit would fail the socket too and free the port, so it is off. Retry spacing is the unit's RestartSec.
StartLimitIntervalSec=0

[Service]
# The tsx CLI spawns a child that reuses fd 3. Run the tsx loader in the same process to inherit the port fd.
ExecStart=
ExecStart=/usr/bin/node --import file:///opt/naia-adk/packages/server/node_modules/tsx/dist/loader.mjs /opt/naia-adk/packages/server/src/cli.ts serve -p 3141 -h 127.0.0.1 -r /opt/naia-adk
