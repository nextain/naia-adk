# Example drop-in: keep the messenger DB, wake spool and token list outside the repository, owned by the API account.
[Service]
Environment=NAIA_MESSENGER_DB=/var/lib/naia-adk/messenger/messenger.db
Environment=NAIA_MESSENGER_WAKE_SPOOL_DIR=/var/lib/naia-adk/messenger/wake-spool
Environment=NAIA_MESSENGER_AGENT_TOKENS_FILE=/var/lib/naia-adk/messenger/agent-tokens.json
Environment=NAIA_MESSENGER_ROLES=naia
Environment=NAIA_DASHBOARD_PUBLIC_URL=https://dashboard.example.com
